<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>MT 远程管理</title>
<style>
:root{--bg:#0f1216;--panel:#171b21;--panel2:#1e242c;--line:#2b333d;--text:#e6eaf0;--sub:#8b96a5;
--brand:#f5c244;--brand2:#ffd766;--ok:#3ddc84;--err:#ff6b6b;--warn:#ffa726;--acc:#5aa9ff}
html[data-theme=light]{--bg:#f4f6f9;--panel:#fff;--panel2:#f0f3f7;--line:#dfe4ea;--text:#1b2027;
--sub:#6b7684;--brand:#d99b00;--brand2:#e8ab10;--acc:#1a73e8}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{height:100%;margin:0}
body{background:var(--bg);color:var(--text);display:flex;flex-direction:column;overflow:hidden;
font:14px/1.55 -apple-system,BlinkMacSystemFont,"Segoe UI","PingFang SC","Microsoft YaHei",sans-serif}
header{flex:0 0 auto;background:var(--panel);border-bottom:1px solid var(--line);padding:10px 14px;
padding-top:calc(10px + env(safe-area-inset-top))}
.tt{display:flex;align-items:center;gap:8px;font-weight:700;margin-bottom:8px;font-size:15px}
.dot{width:9px;height:9px;border-radius:50%;background:var(--sub);flex:0 0 auto}
.dot.on{background:var(--ok);box-shadow:0 0 8px var(--ok)}
.dot.bad{background:var(--err)}
.tt .sp{flex:1}
.badge{font-size:11px;padding:2px 8px;border-radius:999px;border:1px solid var(--line);
background:var(--panel2);color:var(--sub);font-weight:500;white-space:nowrap}
.badge.ok{color:var(--ok);border-color:rgba(61,220,132,.45)}
.badge.warn{color:var(--warn);border-color:rgba(255,167,38,.45)}
.ib{background:var(--panel2);border:1px solid var(--line);color:var(--sub);width:30px;height:30px;
border-radius:8px;cursor:pointer;font-size:14px;display:flex;align-items:center;justify-content:center;padding:0}
.ib:hover{color:var(--text);border-color:var(--brand)}
.row{display:flex;gap:7px;flex-wrap:wrap;align-items:center}
input{background:var(--panel2);border:1px solid var(--line);color:var(--text);border-radius:9px;
padding:7px 10px;font-size:13px;outline:none;font-family:inherit;min-width:0}
input:focus{border-color:var(--brand)}
#host{flex:1 1 170px}#port{flex:0 0 80px;width:80px}
.btn{background:var(--brand);color:#222;border:0;border-radius:9px;padding:8px 15px;font-size:13px;
font-weight:700;cursor:pointer;white-space:nowrap}
.btn:hover{background:var(--brand2)}
.btn.g{background:var(--panel2);color:var(--text);border:1px solid var(--line);font-weight:500}
.btn.g:hover{border-color:var(--brand)}
.btn:disabled{opacity:.45;cursor:not-allowed}
.hint{margin-top:7px;font-size:12px;color:var(--sub)}
.bar{flex:0 0 auto;display:flex;gap:6px;align-items:center;padding:8px 14px;background:var(--panel);
border-bottom:1px solid var(--line);flex-wrap:wrap}
.bar .sep{width:1px;height:22px;background:var(--line);flex:0 0 auto}
.crumb{flex:1 1 140px;display:flex;align-items:center;gap:3px;font-size:12px;color:var(--sub);
overflow-x:auto;white-space:nowrap;min-width:80px;padding:2px 0;scrollbar-width:none}
.crumb::-webkit-scrollbar{display:none}
.crumb span{cursor:pointer;padding:2px 6px;border-radius:6px}
.crumb span:hover{background:var(--panel2);color:var(--text)}
.crumb i{opacity:.4;font-style:normal}
main{flex:1 1 auto;overflow:auto;min-height:0;position:relative;-webkit-overflow-scrolling:touch}
#alerts{flex:0 0 auto}
.alert{display:flex;gap:8px;align-items:center;padding:7px 14px;font-size:12px;
background:rgba(255,167,38,.12);border-bottom:1px solid var(--line);color:var(--warn);flex-wrap:wrap}
.alert button{background:transparent;border:1px solid currentColor;color:inherit;border-radius:6px;
padding:2px 8px;font-size:12px;cursor:pointer}
table{width:100%;border-collapse:collapse;font-size:13px}
th{position:sticky;top:0;background:var(--panel);text-align:left;font-weight:600;font-size:12px;
color:var(--sub);padding:8px 12px;border-bottom:1px solid var(--line);z-index:2}
td{padding:9px 12px;border-bottom:1px solid var(--line);vertical-align:middle}
tr:hover td{background:var(--panel2)}
tr.sel td{background:rgba(90,169,255,.14)}
.nm{display:flex;align-items:center;gap:9px;min-width:0;cursor:pointer}
.pick{width:16px;height:16px;flex:0 0 16px;accent-color:var(--brand);cursor:pointer}
.ic{width:22px;height:22px;text-align:center;flex:0 0 22px;font-size:16px;line-height:22px;
display:flex;align-items:center;justify-content:center}
.ic img{width:22px;height:22px;border-radius:4px;object-fit:contain;display:block}
.nm b{font-weight:500;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.sz,.tm{color:var(--sub);font-size:12px;white-space:nowrap}
.op{white-space:nowrap;text-align:right}
.op button{background:var(--panel2);border:1px solid var(--line);color:var(--sub);border-radius:7px;
padding:4px 9px;font-size:12px;cursor:pointer;margin-left:4px}
.op button:hover{color:var(--text);border-color:var(--brand)}
.st{position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;
gap:13px;text-align:center;padding:24px;color:var(--sub);font-size:13px;background:var(--bg)}
.st h3{margin:0;color:var(--text);font-size:15px}
.sp{width:18px;height:18px;flex:0 0 auto;display:block;animation:sp .8s linear infinite;transform-origin:50% 50%}
.sp .trk{fill:none;stroke:var(--line);stroke-width:3}
.sp .arc{fill:none;stroke:var(--brand);stroke-width:3;stroke-linecap:round;stroke-dasharray:14 43}
@keyframes sp{to{transform:rotate(360deg)}}
@media (prefers-reduced-motion:reduce){.sp{animation-duration:1.6s}}
.card{background:var(--panel);border:1px solid var(--line);border-radius:12px;padding:14px 16px;
text-align:left;max-width:600px;width:100%;font-size:12.5px;color:var(--sub)}
.card ol,.card ul{margin:6px 0 0;padding-left:19px}
.card li{margin:5px 0}
.card b{color:var(--text)}
.card code{background:var(--panel2);padding:1px 6px;border-radius:4px;font-size:11.5px;
word-break:break-all;user-select:all}
#toast{position:fixed;left:50%;bottom:24px;transform:translateX(-50%) translateY(16px);background:var(--panel);
border:1px solid var(--line);padding:9px 16px;border-radius:999px;font-size:13px;opacity:0;transition:.22s;
pointer-events:none;z-index:99;max-width:88vw}
#toast.show{opacity:1;transform:translateX(-50%) translateY(0)}
.mask{position:fixed;inset:0;background:rgba(0,0,0,.55);display:flex;align-items:center;justify-content:center;
z-index:94;padding:16px}
.modal{background:var(--panel);border:1px solid var(--line);border-radius:14px;padding:18px;width:100%;
max-width:480px;max-height:86vh;overflow:auto}
.modal h3{margin:0 0 6px;font-size:15px}
.modal label{display:block;font-size:12px;color:var(--sub);margin:10px 0 4px}
.modal input{width:100%}
.modal .tip{font-size:12px;color:var(--sub);margin:0 0 6px;line-height:1.6}
#editor{width:100%;min-height:260px;font-family:ui-monospace,Menlo,Consolas,monospace;font-size:12px;
line-height:1.6;resize:vertical;background:var(--panel2);border:1px solid var(--line);color:var(--text);
border-radius:9px;padding:10px}
.mfoot{display:flex;gap:8px;justify-content:flex-end;margin-top:16px;flex-wrap:wrap}
.codein{font-size:26px;letter-spacing:9px;text-align:center;text-transform:uppercase;font-weight:700}
.pvmask{position:fixed;inset:0;background:#000;z-index:90;display:flex;flex-direction:column}
.pvbar{flex:0 0 auto;display:flex;align-items:center;gap:8px;padding:8px 12px;background:#111;
padding-top:calc(8px + env(safe-area-inset-top));flex-wrap:wrap}
.pvbar .nm2{flex:1 1 auto;min-width:0;font-size:13px;color:#ddd;overflow:hidden;
text-overflow:ellipsis;white-space:nowrap}
.pvbar button{background:#222;border:1px solid #444;color:#ddd;border-radius:7px;padding:5px 10px;
font-size:12px;cursor:pointer}
.pvbar button:hover{border-color:var(--brand);color:#fff}
.pvbar button.on{background:var(--brand);color:#222;border-color:var(--brand);font-weight:700}
.pvbar button:disabled{opacity:.35;cursor:not-allowed}
.pvbody{flex:1 1 auto;min-height:0;display:flex;align-items:center;justify-content:center;
overflow:auto;padding:10px;position:relative}
.pvbody img{max-width:100%;max-height:100%;object-fit:contain;display:block}
.pvbody video,.pvbody audio{max-width:100%;max-height:100%;outline:none}
.pvbody iframe{width:100%;height:100%;border:0;background:#fff}
.pvbody pre{margin:0;background:var(--panel2);border:1px solid var(--line);border-radius:8px;
padding:12px;font-size:12px;line-height:1.6;overflow:auto;max-width:100%;max-height:100%;
font-family:ui-monospace,Menlo,Consolas,monospace;white-space:pre-wrap;word-break:break-word;
text-align:left;align-self:stretch}
.pvbody .pvempty{color:var(--sub);font-size:13px;text-align:center;padding:20px}
.pvnote{flex:0 0 auto;display:flex;gap:8px;align-items:flex-start;padding:8px 12px;background:#1a1a1a;
border-top:1px solid #333;font-size:12px;color:#bbb;flex-wrap:wrap}
.pvnote .sp2{flex:1 1 auto;min-width:120px}
.pvnote button{background:#222;border:1px solid #444;color:#ddd;border-radius:7px;padding:4px 9px;
font-size:12px;cursor:pointer}
/* ---- 模拟终端 ---- */
.tmask{position:fixed;inset:0;background:#000;z-index:88;display:flex;flex-direction:column}
.tbar{flex:0 0 auto;display:flex;align-items:center;gap:8px;padding:8px 12px;background:#111;
padding-top:calc(8px + env(safe-area-inset-top));border-bottom:1px solid #333;flex-wrap:wrap}
.tbar .ttl{font-weight:700;font-size:13px;color:#ddd}
.tbar .sp3{flex:1 1 auto}
.tbar button{background:#222;border:1px solid #444;color:#ddd;border-radius:7px;padding:5px 10px;
font-size:12px;cursor:pointer}
.tbar button:hover{border-color:var(--brand);color:#fff}
#termOut{flex:1 1 auto;min-height:0;overflow-y:auto;padding:10px 12px;font-size:12px;line-height:1.55;
white-space:pre-wrap;word-break:break-word;font-family:ui-monospace,Menlo,Consolas,"Courier New",monospace}
#termOut .tcmd{color:#4cf}
#termOut .terr{color:#ff6b6b;font-weight:700}
#termOut .twarn{color:#ffa726}
#termOut .tok{color:#3ddc84}
#termOut .tsim{color:#c792ea}
#termOut .tout{color:#ddd}
.termin{flex:0 0 auto;display:flex;align-items:center;gap:8px;padding:8px 12px;background:#111;
border-top:1px solid #333}
.termin .pt{color:#3ddc84;font-size:12px;white-space:nowrap;
font-family:ui-monospace,Menlo,Consolas,monospace}
.termin input{flex:1 1 auto;background:#000;color:#0f0;border:1px solid #333;border-radius:7px;
padding:8px 10px;font-size:12.5px;font-family:ui-monospace,Menlo,Consolas,monospace;outline:none}
.termin input:focus{border-color:var(--brand)}
.kw{color:#c792ea}.str{color:#c3e88d}.num{color:#f78c6c}.cm{color:#6b7684;font-style:italic}
pre.diag{white-space:pre-wrap;word-break:break-all;font-size:11px;line-height:1.5;
background:var(--panel2);border:1px solid var(--line);border-radius:8px;padding:10px;margin:10px 0 0;
max-height:52vh;overflow:auto}
@media(max-width:600px){.tm{display:none}.btn{flex:1 1 auto}td,th{padding:8px 9px}
.op button{padding:4px 7px;margin-left:3px}}
</style>
</head>
<body>

<header>
  <div class="tt">
    <span class="dot" id="dot"></span><span>MT 远程管理</span>
    <span class="badge" id="mode">检测中…</span>
    <span class="sp"></span>
    <button class="ib" id="bDiag" title="诊断（逐步探测接口）" style="font-size:15px">⚕</button>
    <button class="ib" id="bHelp" title="功能说明与限制">?</button>
    <button class="ib" id="bTheme" title="主题">◐</button>
    <button class="ib" id="bForget" title="清除本机配对身份">⎚</button>
  </div>
  <div class="row" id="addrRow">
    <input type="text" id="host" placeholder="手机 IP，如 192.168.1.11">
    <input type="number" id="port" placeholder="端口" value="8081">
    <button class="btn" id="bGo">连接</button>
  </div>
  <div class="hint" id="hint"></div>
</header>

<div id="alerts"></div>

<div class="bar" id="bar" style="display:none">
  <button class="btn g" id="bUp">↑ 上级</button>
  <button class="btn g" id="bJump">跳转…</button>
  <button class="btn g" id="bRefresh">刷新</button>
  <button class="btn g" id="bMkdir">新建</button>
  <button class="btn" id="bUpload">上传</button>
  <input type="file" id="files" multiple webkitdirectory style="display:none">
  <input type="file" id="filesFlat" multiple style="display:none">
  <div class="sep"></div>
  <button class="btn g" id="bAll">全选</button>
  <button class="btn g" id="bCopy">复制</button>
  <button class="btn g" id="bCut">剪切</button>
  <button class="btn g" id="bPaste" disabled>粘贴</button>
  <button class="btn g" id="bDel">删除</button>
  <button class="btn g" id="bZip" title="把勾选的文件或整个目录打包成 ZIP 下载">打包</button>
  <div class="sep"></div>
  <button class="btn g" id="bTerm" title="模拟终端：可仿真运行 sh 脚本">终端</button>
  <div class="crumb" id="crumb"></div>
</div>

<main id="main">
  <div id="listWrap"></div>
  <div class="st" id="st" style="display:none"></div>
</main>
<div id="toast"></div>

<!-- 模拟终端 -->
<div class="tmask" id="termWrap" style="display:none">
  <div class="tbar">
    <span class="ttl">模拟终端</span>
    <span class="badge" id="termUid">uid=?</span>
    <span class="badge warn">破坏性命令仅仿真，不落真机</span>
    <span class="sp3"></span>
    <button data-t="help">帮助</button>
    <button data-t="report">报告</button>
    <button data-t="reset">重置</button>
    <button data-t="close">关闭 ✕</button>
  </div>
  <div id="termOut"></div>
  <div class="termin">
    <span class="pt" id="termPrompt">$</span>
    <input id="termIn" autocomplete="off" spellcheck="false" placeholder="输入命令，Tab 补全，↑↓ 历史，Ctrl+C 中断">
  </div>
</div>

<!-- 脚本仿真行为报告 -->
<div class="mask" id="repModal" style="display:none">
  <div class="modal">
    <h3>📋 脚本仿真行为报告</h3>
    <pre class="diag" id="repText"></pre>
    <div class="tip" style="margin-top:10px">以上行为全部在浏览器虚拟环境中仿真，<b>未对你的手机产生任何实际影响</b>。</div>
    <div class="mfoot"><button class="btn g" id="repClose">关闭</button></div>
  </div>
</div>

<script>
"use strict";
/* ============================================================================
   MT 远程管理 · 网页客户端（合并稳定版）

   本页不含任何服务端逻辑。真正读写手机文件的是手机里的 MT 管理器 App
   （它内置 HTTP 服务）。连接必须经 MT 页面上的配对码授权，没有绕过任何限制。

   ── 稳定性设计（相对原始实现的三处实质修复）──────────────────────────
   1) 列表竞态：连续切换目录时，先发的请求可能后返回并覆盖新目录内容。
      这里给每次 load 编号，返回时编号对不上就直接丢弃，不再渲染。
   2) 同名误判：原先按文件名查大小/类型，同名不同目录会取错。
      这里统一改为按完整路径比对。
   3) 重复连接：连点「连接」会并发跑两套配对流程。这里加忙锁，连接中直接忽略。

   ── 未验证细节的运行时自适应 ──────────────────────────────────────────
   无文档确认的三处，全部做成「试 → 失败换一种 → 记住可用的」：
     · ECDSA 签名编码：DER / P-1363
     · 配对公钥提交格式：JWK 对象 / raw 字符串
     · 删除、复制、移动的请求体字段（各 3~4 种候选）
   自适应结果写入 localStorage 长期复用。失败详情见右上角 ⚕ 诊断。
   ========================================================================= */

const $ = id => document.getElementById(id);

const AUTH_TAG = 'MT-REMOTE-AUTH-v1';
const EMPTY_HASH = '47DEQpj8HBSa-_TImW-5JCeuQeRkm5NMpJWZG3hSuFU'; // SHA256("") 的 base64url
const MAX_TEXT  = 5 * 1024 * 1024;    // 超过此大小不做文本预览/编辑，防卡死
const HARD_TEXT = 200000;             // 超过此字符数不着色、只截断显示
const BIG_FILE  = 60 * 1024 * 1024;   // 超过此大小改用窗口下载，避免整文件进内存
const ICON_CACHE_MAX = 150;           // 图标 objectURL 上限，超出回收最旧的
const REQ_TIMEOUT = 30000;            // 单请求超时（图标类短请求另算）

const S = {
  mode:'cross', host:'', port:'8081', path:'/',
  items:[], view:[],
  identity:null, skew:0, root:'',
  sigFmt:'der',          // 自适应：'der' | 'raw'
  pubFmt:'jwk',          // 自适应：'jwk' | 'raw'
  clip:null,             // 复制/剪切暂存 {mode, base, items}
  sel:new Set(),
  busy:false,            // 连接忙锁，防重复连接
  seq:0,                 // 列表请求序号，防竞态覆盖
  iconCache:new Map(),
};

/* ---------------- 小工具 ---------------- */
function toast(m){ const t=$('toast'); t.textContent=m; t.classList.add('show');
  clearTimeout(t._t); t._t=setTimeout(()=>t.classList.remove('show'), 2800); }
function esc(s){ return String(s==null?'':s).replace(/[&<>"]/g,
  c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c])); }
const enc = new TextEncoder();
function b64u(buf){
  const b = buf instanceof Uint8Array ? buf : new Uint8Array(buf);
  let s=''; for(let i=0;i<b.length;i++) s += String.fromCharCode(b[i]);
  return btoa(s).replace(/\+/g,'-').replace(/\//g,'_').replace(/=+$/,'');
}
async function sha256B64(data){
  let d;
  if(typeof data === 'string') d = enc.encode(data);
  else if(data instanceof Uint8Array) d = data;
  else if(data instanceof ArrayBuffer) d = new Uint8Array(data);
  else if(typeof Blob !== 'undefined' && data instanceof Blob) d = new Uint8Array(await data.arrayBuffer());
  else return EMPTY_HASH;
  return b64u(await crypto.subtle.digest('SHA-256', d));
}
/* P-1363(64 字节 r||s) → DER */
function p1363ToDer(raw){
  const r = raw.slice(0,32), s = raw.slice(32,64);
  const trim = b => { let i=0; while(i<b.length-1 && b[i]===0) i++; return b.slice(i); };
  const encInt = b => { let v = trim(b);
    if(v[0] & 0x80){ const t = new Uint8Array(v.length+1); t[0]=0; t.set(v,1); v=t; }
    const o = new Uint8Array(v.length+2); o[0]=0x02; o[1]=v.length; o.set(v,2); return o; };
  const a = encInt(r), b2 = encInt(s);
  const body = new Uint8Array(a.length + b2.length); body.set(a,0); body.set(b2,a.length);
  const out = new Uint8Array(body.length+2); out[0]=0x30; out[1]=body.length; out.set(body,2);
  return out;
}
const extOf = n => { const m = /\.([a-z0-9]+)$/i.exec(String(n||'')); return m ? m[1].toLowerCase() : ''; };
const SPIN = '<svg class="sp" viewBox="0 0 24 24" width="18" height="18" aria-hidden="true">'+
  '<circle class="trk" cx="12" cy="12" r="9"/><circle class="arc" cx="12" cy="12" r="9"/></svg>';
const fmtSize = n => { if(!n) return '—'; const u=['B','KB','MB','GB','TB']; let i=0; n=+n;
  while(n>=1024 && i<u.length-1){ n/=1024; i++; }
  return (i===0?n:n.toFixed(i===1?0:1))+' '+u[i]; };
function fmtTime(t){ if(!t) return '—'; const ms = t<1e12 ? t*1000 : t; const d=new Date(ms);
  if(isNaN(d)) return '—'; const p=n=>String(n).padStart(2,'0');
  return d.getFullYear()+'-'+p(d.getMonth()+1)+'-'+p(d.getDate())+' '+p(d.getHours())+':'+p(d.getMinutes()); }
function normPath(p){
  if(!p) return '/';
  let s = String(p).trim().replace(/\\/g,'/');
  if(!s.startsWith('/')) s = '/'+s;
  const out=[];
  for(const seg of s.split('/')){
    if(seg==='' || seg==='.') continue;
    if(seg==='..'){ out.pop(); continue; }
    out.push(seg);
  }
  return '/'+out.join('/');
}
const sleep = ms => new Promise(r => setTimeout(r, ms));

/* ============================================================================
   身份：ECDSA P-256 密钥对，私钥只存本机，永不外发
   ========================================================================= */
const idKey = () => 'mtra_id_' + (S.root || S.host + ':' + S.port);
function loadId(){ try{ return JSON.parse(localStorage.getItem(idKey()) || 'null'); }catch(e){ return null; } }
function saveId(o){ localStorage.setItem(idKey(), JSON.stringify(o)); }
function clearId(){ localStorage.removeItem(idKey()); S.identity = null; }

async function newIdentity(){
  const kp = await crypto.subtle.generateKey({name:'ECDSA', namedCurve:'P-256'}, true, ['sign','verify']);
  const jwk = await crypto.subtle.exportKey('jwk', kp.privateKey);
  const raw = new Uint8Array(await crypto.subtle.exportKey('raw', kp.publicKey));
  return {
    jwk,
    publicKey: { kty:'EC', crv:'P-256', x:b64u(raw.slice(1,33)), y:b64u(raw.slice(33,65)) },
    publicKeyRaw: b64u(raw),
  };
}
async function privKey(){
  return crypto.subtle.importKey('jwk', S.identity.jwk, {name:'ECDSA', namedCurve:'P-256'}, false, ['sign']);
}

/* ============================================================================
   请求层：超时 + 网络重试 + 401 签名格式自愈
   ========================================================================= */
const apiUrl = tq => S.mode === 'same' ? tq : ('http://' + S.host + ':' + S.port + tq);

async function signHeaders(method, tq, bodyHash){
  const ts = String(Date.now() + S.skew);
  const nonce = b64u(crypto.getRandomValues(new Uint8Array(16)));
  const payload = [AUTH_TAG, method.toUpperCase(), tq, ts, nonce, bodyHash].join('\n');
  const raw = new Uint8Array(await crypto.subtle.sign(
    {name:'ECDSA', hash:'SHA-256'}, await privKey(), enc.encode(payload)));
  const sig = S.sigFmt === 'der' ? b64u(p1363ToDer(raw)) : b64u(raw);
  return {
    'X-MT-Auth-Device': S.identity.deviceId,
    'X-MT-Auth-Timestamp': ts,
    'X-MT-Auth-Nonce': nonce,
    'X-MT-Auth-Content-SHA256': bodyHash,
    'X-MT-Auth-Signature': sig,
  };
}

function buildInit(method, opt, body){
  const h = Object.assign({}, opt.headers || {});
  if(opt.json) h['Content-Type'] = 'application/json; charset=UTF-8';
  if(S.identity) Object.assign(h, opt._auth || {});
  const init = { method, headers:h, body };
  if(opt.timeout !== 0){
    const ac = new AbortController();
    init.signal = ac.signal;
    setTimeout(() => ac.abort(), opt.timeout || REQ_TIMEOUT);
  }
  return init;
}

/* 单次尝试：网络层错误重试一次（手机锁屏/Wi-Fi 抖动很常见） */
async function attempt(method, tq, opt){
  const body = opt.json ? JSON.stringify(opt.json) : opt.body;
  const bodyHash = opt.contentHash || await sha256B64(body);
  if(S.identity) opt._auth = await signHeaders(method, tq, bodyHash);
  let lastErr = null;
  for(let i = 0; i < 2; i++){
    try{
      return await fetch(apiUrl(tq), buildInit(method, opt, body));
    }catch(e){
      lastErr = e;
      if(e.name === 'AbortError') break;       // 超时不重试
      await sleep(400);                        // 网络抖动：稍等重试一次
    }
  }
  throw lastErr;
}

async function call(method, tq, opt){
  opt = opt || {};
  let r = await attempt(method, tq, opt);
  // 401 自愈：先怀疑签名编码，换另一种再试一次
  if(r.status === 401 && S.identity && !opt._retried){
    S.sigFmt = S.sigFmt === 'der' ? 'raw' : 'der';
    const id = loadId(); if(id){ id.sigFmt = S.sigFmt; saveId(id); }
    const o2 = Object.assign({}, opt, {_retried:1});
    r = await attempt(method, tq, o2);
    if(r.status !== 401) return r;
  }
  if(r.status === 401 && S.identity) onUnauthorized();
  return r;
}
async function apiJson(method, tq, opt){
  const r = await call(method, tq, opt);
  const txt = await r.text();
  if(!r.ok){
    let m = txt;
    try{ const j = JSON.parse(txt); m = j.error || j.message || txt; }catch(e){}
    const err = new Error('HTTP ' + r.status + ' ' + String(m).slice(0,180));
    err.status = r.status; err.body = txt;
    throw err;
  }
  try{ return JSON.parse(txt); }catch(e){ return txt; }
}
function onUnauthorized(){
  clearId();
  $('dot').className = 'dot bad';
  $('bar').style.display = 'none';
  status('<h3>身份已失效</h3><div>手机端可能已解除配对，或本页猜错了签名格式。</div>'+
    '<div class="row" style="justify-content:center"><button class="btn" id="rePair">重新配对</button>'+
    '<button class="btn g" id="reDiag">诊断</button></div>');
  const b = $('rePair'); if(b) b.onclick = () => start(true);
  const d = $('reDiag'); if(d) d.onclick = () => runDiag();
}

/* ============================================================================
   配对
   ========================================================================= */
async function pair(code){
  const id = await newIdentity();
  const attempts = S.pubFmt === 'jwk' ? ['jwk','raw'] : ['raw','jwk'];
  let lastErr = '';
  for(const fmt of attempts){
    const body = { code:String(code).trim(), trust:true };
    body.publicKey = fmt === 'jwk' ? id.publicKey : id.publicKeyRaw;
    try{
      const r = await fetch(apiUrl('/api/auth/pair'), {
        method:'POST', headers:{'Content-Type':'application/json; charset=UTF-8'},
        body:JSON.stringify(body) });
      const txt = await r.text();
      let j = {}; try{ j = JSON.parse(txt); }catch(e){}
      if(r.ok && j.deviceId){
        S.pubFmt = fmt;
        S.identity = { deviceId:j.deviceId, jwk:id.jwk, sigFmt:S.sigFmt, pubFmt:fmt };
        saveId(S.identity);
        return;
      }
      lastErr = j.error || ('HTTP ' + r.status);
    }catch(e){ lastErr = e.message; }
  }
  throw new Error(lastErr || '配对失败');
}
function openPair(initial){

    '<p class="tip">在手机 MT 管理器的「远程管理 → HTTP」页面可以看到配对码，通常几分钟内有效。</p>'+
    '<input class="codein" id="pc" maxlength="12" placeholder="······" value="'+esc(initial||'')+'">',

}

/* ============================================================================
   启动 / 模式检测（忙锁防重复连接）
   ========================================================================= */
async function start(forcePair){
  if(S.busy && !forcePair){ return; }        // 忙锁：连点「连接」不再并发
  S.busy = true;
  $('dot').className = 'dot';
  $('bar').style.display = 'none';
  showSpinner('正在连接…');
  try{
    const r = await call('GET', '/api/auth/status');
    if(r.ok){
      try{
        const j = await r.json();
        if(j && j.serverTime) S.skew = Number(j.serverTime) - Date.now();
      }catch(e){}
    }
  }catch(e){
    S.busy = false;
    $('dot').className = 'dot bad';
    status('<h3>连不上手机</h3>' +
      (S.mode === 'same' ? '<div>无法访问本机 MT 服务，请确认远程管理已启动。</div>'
                         : '<div>无法访问 ' + esc(S.host) + ':' + esc(S.port) + '</div>') +
      failCard(e.message));
    return;
  }
  S.identity = loadId();
  if(S.identity){
    S.sigFmt = S.identity.sigFmt || 'der';
    if(S.identity.pubFmt) S.pubFmt = S.identity.pubFmt;
  }
  if(forcePair || !S.identity){ S.busy = false; openPair(); return; }
  try{
    const r = await call('GET', '/api/auth/session');
    if(!r.ok) throw new Error('HTTP ' + r.status);
    $('dot').className = 'dot on';
    S.busy = false;
    onAuthed();
  }catch(e){ S.busy = false; clearId(); openPair(); }
}

/* ============================================================================
   列表解析：目录/文件判定
   ========================================================================= */
const target = path => '/api/files?path=' + encodeURIComponent(path);
function pickList(d){
  if(Array.isArray(d)) return d;
  if(!d || typeof d !== 'object') return [];
  for(const k of ['items','files','list','data','entries','result','children','content'])
    if(Array.isArray(d[k])) return d[k];
  for(const k of ['data','result','response']){
    const v = d[k];
    if(v && typeof v === 'object')
      for(const k2 of ['items','files','list','entries','children'])
        if(Array.isArray(v[k2])) return v[k2];
  }
  for(const k in d) if(Array.isArray(d[k])) return d[k];
  return [];
}
const ROOT_DIRS = ['apex','bin','data','etc','mnt','proc','sys','system','vendor','dev','sbin','sdcard','storage'];
let DIR_HINT = '';

/* 返回 true/false 表示确定；null 表示服务端没给类型字段，交给启发式 */
function isDirOf(o){
  if(typeof o.isFile === 'boolean'){ DIR_HINT = 'isFile=' + o.isFile; return !o.isFile; }
  const ti = o.typeIcon != null ? String(o.typeIcon).trim().toLowerCase() : '';
  if(ti){
    DIR_HINT = 'typeIcon=' + ti;
    if(ti === 'folder') return true;
    if(ti === 'file') return false;
    if(ti.indexOf('folder') >= 0) return true;
    if(ti.indexOf('file') >= 0) return false;
  }
  for(const k of ['isDirectory','isDir','directory','folder','isFolder','is_directory'])
    if(o[k] != null && typeof o[k] === 'boolean'){ DIR_HINT = k + '=' + o[k]; return !!o[k]; }
  const t = o.type != null ? o.type : (o.kind != null ? o.kind : (o.fileType != null ? o.fileType : null));
  if(t != null){
    const s = String(t).trim().toLowerCase();
    DIR_HINT = 'type=' + JSON.stringify(t);
    if(s === 'folder' || s === 'directory' || s === 'dir' || s === 'd' || s === 'catalog') return true;
    if(s === 'file' || s === 'f' || s === 'regular' || s === 'regularfile' || s === 'document') return false;
    if(/^\d+$/.test(s)) return Number(s) === 2;
  }
  const m = o.mode != null ? o.mode : (o.permissions != null ? o.permissions : null);
  if(typeof m === 'number' && m > 0){ DIR_HINT = 'mode=' + m; return (m & 0o170000) === 0o040000; }
  if(typeof m === 'string' && /^[d-]/.test(m)){ DIR_HINT = 'mode ' + m; return m[0] === 'd'; }
  const nm = String(o.name ?? o.path ?? '');
  if(nm.endsWith('/')){ DIR_HINT = '名称以 / 结尾'; return true; }
  DIR_HINT = '无明确字段';
  return null;
}
function guessDirScore(o){
  const name = String(o.name ?? '').replace(/\/+$/,'');
  const path = String(o.path ?? '');
  const size = Number(o.size ?? o.length ?? -1);
  let s = 0.5;
  const dot = name.lastIndexOf('.');
  const hasExt = dot > 0 && dot < name.length - 1;
  if(!hasExt) s += 0.25; else s -= 0.15;
  if(ROOT_DIRS.indexOf(name) >= 0) s += 0.45;
  if(size > 0) s -= 0.4; else if(size === 0) s += 0.15; else if(size === -1) s += 0.3;
  if(/\/$/.test(path)) s += 0.3;
  if(typeof o.mime === 'string' && /directory/i.test(o.mime)) s += 0.5;
  return Math.max(0, Math.min(1, s));
}
/* 注意：DIR_HINT 是全局的，遍历时会被最后一项覆盖。
   因此必须在这里把依据固化到返回值里，诊断才不会张冠李戴。 */
function decideDir(o){
  const r = isDirOf(o);
  if(r !== null) return { isDir:r, confident:true, hint:DIR_HINT };
  const score = guessDirScore(o);
  return { isDir: score >= 0.5, confident: score >= 0.7 || score <= 0.3, hint:DIR_HINT };
}
function extract(d){
  return pickList(d).map(o => {
    if(!o || typeof o !== 'object') return null;
    let raw = '';
    for(const k of ['path','fullPath','absolutePath','uri'])
      if(o[k] != null && String(o[k]) !== ''){ raw = String(o[k]); break; }
    let name = o.name != null ? o.name : (o.fileName != null ? o.fileName : null);
    if(name == null) name = String(raw).split('/').filter(Boolean).pop();
    name = String(name).replace(/\/+$/,'');
    if(!name) return null;
    const dd = decideDir(o);
    return { name, raw: raw || name, isDir:!!dd.isDir, confident:!!dd.confident, hint:dd.hint || '',
      size: Number(o.size || o.length || 0) || 0,
      time: Number(o.time || o.mtime || o.lastModified || o.modified || 0) || 0,
      mime: typeof o.mime === 'string' ? o.mime : '' };
  }).filter(Boolean);
}

const T = {

/* 注意：apk 必须保留独立类型，否则 APK 真实图标与专属预览会失效。
   能否解压由 archKind() 单独判断，两者互不干扰。 */
function kindOf(name, isDir){
  if(isDir) return 'dir';
  const e = extOf(name);
  for(const k in T) if(T[k].indexOf(e) >= 0) return k;
  if(TEXT_EXT.indexOf(e) >= 0) return 'text';
  if(!e) return 'text';
  return 'other';
}
/* 可真实解压查看的容器 */
const ARCH_EXT = ['zip','apk','apks','xapk','jar','tar','gz','tgz','bz2'];
function archKind(name){
  const n = String(name || '').toLowerCase();
  if(/\.(zip|apk|apks|xapk|jar)$/.test(n)) return 'zip';
  if(/\.tar$/.test(n)) return 'tar';
  if(/\.(tgz|tar\.gz)$/.test(n)) return 'targz';
  if(/\.gz$/.test(n)) return 'gz';

}

const ARCH_UNSUPPORTED = ['rar','7z','bz2','xz','zipx'];
function archUnsupported(name){

  return ARCH_UNSUPPORTED.indexOf(e) >= 0
    ? (e === 'rar' ? 'RAR 是专有格式' : e === '7z' ? '7z 需 LZMA 解码器' : '该压缩算法浏览器不支持') : null;
}
const ICON = { dir:'📁', img:'🖼', video:'🎬', audio:'🎵', pdf:'📕', html:'🌐',
  office:'📘', apk:'📦', archive:'🗜', text:'📄', other:'📄' };

/* ============================================================================
   压缩包：真实解压（ZIP/APK/TAR/TAR.GZ）+ 打包下载（ZIP store）
   全部在浏览器内完成，不依赖任何外部库
   ========================================================================= */
function crc32(buf){
  let table = crc32.t;
  if(!table){
    table = crc32.t = new Uint32Array(256);
    for(let n = 0; n < 256; n++){
      let c = n;
      for(let k = 0; k < 8; k++) c = (c & 1) ? (0xEDB88320 ^ (c >>> 1)) : (c >>> 1);
      table[n] = c >>> 0;
    }
  }
  const u = buf instanceof Uint8Array ? buf : new Uint8Array(buf);
  let crc = 0xFFFFFFFF;
  for(let i = 0; i < u.length; i++) crc = table[(crc ^ u[i]) & 0xFF] ^ (crc >>> 8);
  return (crc ^ 0xFFFFFFFF) >>> 0;
}
async function inflateRaw(u8, fmt){
  const ds = new DecompressionStream(fmt || 'deflate-raw');
  const w = ds.writable.getWriter();
  w.write(u8); w.close();
  const ab = await new Response(ds.readable).arrayBuffer();
  return new Uint8Array(ab);
}
/* 解析 ZIP（含 APK）：走中央目录，读出每个条目的原始压缩数据 */
function parseZip(buf){
  const u8 = buf instanceof Uint8Array ? buf : new Uint8Array(buf);
  const dv = new DataView(u8.buffer, u8.byteOffset, u8.byteLength);
  let eocd = -1;
  const min = Math.max(0, u8.length - 65558);
  for(let i = u8.length - 22; i >= min; i--){
    if(dv.getUint32(i, true) === 0x06054b50){ eocd = i; break; }
  }
  if(eocd < 0) throw new Error('找不到 ZIP 结尾标记，可能不是有效压缩包');
  let count = dv.getUint16(eocd + 10, true);
  let p = dv.getUint32(eocd + 16, true);
  const dec = new TextDecoder('utf-8', {fatal:false});
  const out = [];
  const MAXE = 5000;
  for(let i = 0; i < count && i < MAXE; i++){
    if(p + 46 > u8.length || dv.getUint32(p, true) !== 0x02014b50) break;
    const flags   = dv.getUint16(p + 8, true);
    const method  = dv.getUint16(p + 10, true);
    const csize   = dv.getUint32(p + 20, true);
    const usize   = dv.getUint32(p + 24, true);
    const nlen    = dv.getUint16(p + 28, true);
    const elen    = dv.getUint16(p + 30, true);
    const clen    = dv.getUint16(p + 32, true);
    const lho     = dv.getUint32(p + 42, true);
    let name = dec.decode(u8.subarray(p + 46, p + 46 + nlen));
    if(flags & 0x800) name = utf8ZipName(name);           // UTF-8 名标记，已解码
    const lnlen = dv.getUint16(lho + 26, true);
    const lelen = dv.getUint16(lho + 28, true);
    const start = lho + 30 + lnlen + lelen;
    out.push({ name, method, csize, usize,
      data: u8.subarray(start, Math.min(u8.length, start + csize)),
      crc: dv.getUint32(p + 16, true) });
    p += 46 + nlen + elen + clen;
  }
  return out;
}
/* 中央目录 UTF-8 标记已置位时，TextDecoder 已按 UTF-8 解过了，这里仅兜底 */
function utf8ZipName(s){ return s; }
/* 解析 TAR：512 字节头 + 数据块（512 对齐） */
function parseTar(u8){
  const dec = new TextDecoder('utf-8', {fatal:false});
  const out = [];
  let p = 0;
  while(p + 512 <= u8.length){
    const hdr = u8.subarray(p, p + 512);
    if(hdr.every(b => b === 0)) break;
    let name = dec.decode(hdr.subarray(0, 100)).replace(/\0.*$/, '');
    const prefix = dec.decode(hdr.subarray(345, 500)).replace(/\0.*$/, '');
    if(prefix) name = prefix + '/' + name;
    let size = 0;
    const sizeStr = dec.decode(hdr.subarray(124, 136)).replace(/\0.*$/, '').trim();
    size = parseInt(sizeStr.replace(/[^0-7]/g, ''), 8) || 0;
    const type = String.fromCharCode(hdr[156]);
    p += 512;
    const data = u8.subarray(p, p + size);
    p += Math.ceil(size / 512) * 512;
    if(type === '5') continue;                              // 目录条目
    if(!name) continue;
    out.push({ name, method:0, csize:size, usize:size, data, crc:crc32(data) });
  }
  return out;
}
/* 统一入口：把归档字节解成条目列表 */
async function readArchive(bytes, kind, srcName){
  let u8 = bytes instanceof Uint8Array ? bytes : new Uint8Array(bytes);
  if(kind === 'targz' || kind === 'gz'){
    u8 = await inflateRaw(u8, 'gzip');
    if(kind === 'gz'){
      const nm = (srcName || 'file').replace(/\.(tgz|gz)$/i, '');
      return [{ name: nm, method:0, csize:u8.length, usize:u8.length, data:u8, crc:crc32(u8) }];
    }
    return parseTar(u8);
  }
  if(kind === 'tar') return parseTar(u8);
  return parseZip(u8);
}
/* 取某个条目的真实内容（按需解压，不是一次性全解） */
async function entryData(e){
  if(e.method === 0) return e.data;
  if(e.method === 8) return await inflateRaw(e.data, 'deflate-raw');
  throw new Error('不支持的压缩算法（method=' + e.method + '）');
}
/* 生成 ZIP（store 无压缩）：用于把手机上的多个文件/整个目录打包下载 */
function zipStore(files){
  const enc = new TextEncoder();
  const parts = [], central = [];
  let offset = 0;
  for(const f of files){
    const nm = enc.encode(f.name);
    const data = f.data instanceof Uint8Array ? f.data : new Uint8Array(f.data);
    const crc = crc32(data);
    const lh = new Uint8Array(30), lv = new DataView(lh.buffer);
    lv.setUint32(0, 0x04034b50, true); lv.setUint16(4, 20, true);
    lv.setUint16(6, 0x0800, true);   // bit11：文件名为 UTF-8，否则中文名在多数解压工具里乱码
    lv.setUint16(8, 0, true); lv.setUint16(10, 0, true); lv.setUint16(12, 0, true);
    lv.setUint32(14, crc, true); lv.setUint32(18, data.length, true); lv.setUint32(22, data.length, true);
    lv.setUint16(26, nm.length, true); lv.setUint16(28, 0, true);
    const block = new Uint8Array(30 + nm.length + data.length);
    block.set(lh, 0); block.set(nm, 30); block.set(data, 30 + nm.length);
    parts.push(block);
    const ch = new Uint8Array(46), cv = new DataView(ch.buffer);
    cv.setUint32(0, 0x02014b50, true); cv.setUint16(4, 20, true); cv.setUint16(6, 20, true);
    cv.setUint16(8, 0x0800, true);   // 同上，中央目录也要置位
    cv.setUint16(10, 0, true); cv.setUint16(12, 0, true); cv.setUint16(14, 0, true);
    cv.setUint32(16, crc, true); cv.setUint32(20, data.length, true); cv.setUint32(24, data.length, true);
    cv.setUint16(28, nm.length, true); cv.setUint16(30, 0, true); cv.setUint16(32, 0, true);
    cv.setUint16(34, 0, true); cv.setUint16(36, 0, true); cv.setUint32(38, 0, true);
    cv.setUint32(42, offset, true);
    const ce = new Uint8Array(46 + nm.length);
    ce.set(ch, 0); ce.set(nm, 46);
    central.push(ce);
    offset += block.length;
  }
  const cdSize = central.reduce((a,b) => a + b.length, 0);
  const eo = new Uint8Array(22), ev = new DataView(eo.buffer);
  ev.setUint32(0, 0x06054b50, true); ev.setUint16(4, 0, true); ev.setUint16(6, 0, true);
  ev.setUint16(8, files.length, true); ev.setUint16(10, files.length, true);
  ev.setUint32(12, cdSize, true); ev.setUint32(16, offset, true); ev.setUint16(20, 0, true);
  const all = [...parts, ...central, eo];
  const total = all.reduce((a,b) => a + b.length, 0);
  const out = new Uint8Array(total);
  let q = 0;
  for(const a of all){ out.set(a, q); q += a.length; }
  return out;
}

/* ---------- 归档查看界面 ---------- */
const ARC = { entries:null, name:'', kind:null };
async function openArchive(i){
  const it = S.view[i];
  if(!it) return;
  const p = fullPath(it), name = it.name;
  const kind = archKind(name);
  const bad = archUnsupported(name);
  if(bad){
    modal('无法查看', '<div class="tip">' + esc(name) + '：' + bad + '，浏览器内无法解压。</div>' +
      '<div class="tip">可以先下载，再用 ZArchiver / MT 管理器打开。</div>',
      {ok:'知道了', cancel:null});
    return;
  }
  if(!kind){ toast('不支持的归档类型'); return; }
  // 解压需整文件读入内存，先挡一下，避免大 APK 把页面卡死
  const sz = sizeOf(p);
  if(sz > 80 * 1024 * 1024){
    const go = await termConfirm('「' + name + '」约 ' + fmtSize(sz) +
      '，解压需全部读入内存，可能很慢甚至卡死。\n建议先下载再用 MT 管理器打开。仍要继续？');
    if(!go) return toast('已取消');
  }
  const m = modal('解压查看 · ' + name,
    '<div class="tip" id="arcTip">' + SPIN + ' 正在读取并解析…</div>' +
    '<div id="arcList" style="max-height:52vh;overflow:auto;margin-top:8px;' +
    'border:1px solid var(--line);border-radius:8px"></div>',
    {ok:null, cancel:'关闭'});
  try{
    const r = await call('GET', '/api/file-content?path=' + encodeURIComponent(p) + '&disposition=inline');
    if(!r.ok) throw new Error('HTTP ' + r.status);
    const buf = new Uint8Array(await r.arrayBuffer());
    const entries = await readArchive(buf, kind, name);
    ARC.entries = entries; ARC.name = name; ARC.kind = kind;
    const tip = m.q('#arcTip');
    if(tip) tip.textContent = '共 ' + entries.length + ' 项 · 解压在浏览器内完成，未上传任何数据';
    const box = m.q('#arcList');
    const sorted = entries.slice().sort((a,b) => a.name.localeCompare(b.name, 'zh'));
    let h = '<table style="font-size:12px"><tbody>';
    sorted.forEach((e, idx) => {
      const nm = e.name.split('/').filter(Boolean).pop() || e.name;
      const isTxt = TEXT_EXT.indexOf(extOf(nm)) >= 0 || !extOf(nm);
      h += '<tr><td style="padding:7px 10px;word-break:break-all">' +
        '<span style="color:var(--sub)">' + esc(e.name) + '</span></td>' +
        '<td class="sz" style="white-space:nowrap">' + fmtSize(e.usize) + '</td>' +
        '<td style="text-align:right;white-space:nowrap">' +
        '<button data-ai="' + idx + '" data-aa="view"' + (isTxt ? '' : ' disabled') +
        ' style="' + (isTxt ? '' : 'opacity:.4;') + '">查看</button> ' +
        '<button data-ai="' + idx + '" data-aa="save">提取</button></td></tr>';
    });
    h += '</tbody></table>';
    box.innerHTML = h;
    box.onclick = ev => {
      const b = ev.target.closest('button');
      if(!b || b.disabled) return;
      const e = sorted[+b.dataset.ai];
      if(!e) return;
      if(b.dataset.aa === 'view') viewArcEntry(e);
      else saveArcEntry(e);
    };
  }catch(err){
    const tip = m.q('#arcTip');
    if(tip) tip.textContent = '解析失败：' + err.message;
  }
}
async function viewArcEntry(e){
  const nm = e.name.split('/').filter(Boolean).pop() || e.name;
  const sub = modal('查看 ' + nm, '<pre class="diag" id="arcTxt">' + SPIN + '</pre>',
    {ok:'关闭', cancel:null});
  try{
    let data = await entryData(e);
    // 二进制内容（如 APK 内的 AndroidManifest.xml、resources.arsc、dex）不能当文本显示
    const probe = data.subarray(0, Math.min(4096, data.length));
    if(probe.indexOf(0) >= 0){
      const el0 = sub.q('#arcTxt');
      if(el0) el0.textContent = '这是二进制文件（' + nm + '），共 ' + fmtSize(e.usize) +
        ' 字节，无法以文本显示。\n可直接点「提取」把它单独下载出来。';
      return;
    }
    let txt = new TextDecoder('utf-8', {fatal:false}).decode(data);
    if(/^\xEF\xBB\xBF/.test(txt)) txt = txt.slice(1);
    const el = sub.q('#arcTxt');
    if(el){
      if(txt.length > HARD_TEXT){
        el.textContent = txt.slice(0, HARD_TEXT) + '\n…（仅显示前 ' + HARD_TEXT + ' 字符）';
      }else{
        el.innerHTML = highlight(txt, extOf(nm));
      }
    }
  }catch(err){
    const el2 = sub.q('#arcTxt');
    if(el2) el2.textContent = '解压失败：' + err.message;
  }
}
async function saveArcEntry(e){
  try{
    const data = await entryData(e);
    const nm = e.name.split('/').filter(Boolean).pop() || 'file';
    saveBlobObject(new Blob([data], {type:'application/octet-stream'}), nm);
    toast('已提取 ' + nm);
  }catch(err){ toast('提取失败：' + err.message); }
}

/* 把手机上的多个文件/整个目录打包成 ZIP 下载 */
async function downloadAsZip(items){
  const m = modal('打包下载', '<div class="tip" id="zpTip">准备…</div>' +
    '<div style="height:6px;background:var(--panel2);border-radius:999px;overflow:hidden;margin-top:8px">' +
    '<div id="zpBar" style="height:100%;width:0;background:var(--brand);transition:width .2s"></div></div>',
    {ok:null, cancel:'取消'});
  const setTip = t => { const e = m.q('#zpTip'); if(e) e.textContent = t; };
  const setBar = (d,t) => { const e = m.q('#zpBar'); if(e) e.style.width = (t ? Math.round(d/t*100) : 0) + '%'; };
  const files = [];
  let done = 0, total = 1, fail = 0;
  const MAX_TOTAL = 200 * 1024 * 1024;   // 单次打包上限 200MB，防止内存爆
  let acc = 0;
  async function collect(dir, rel){
    let items2;
    try{ items2 = await tList(dir); }catch(e){ return; }
    for(const it of items2){
      if(acc > MAX_TOTAL){ setTip('已超过 200MB，停止打包'); return; }
      const fp = (dir === '/' ? '' : dir) + '/' + it.name;
      const rp = rel ? rel + '/' + it.name : it.name;
      if(it.isDir){ await collect(fp, rp); continue; }
      total++;
      try{
        const r = await call('GET', '/api/file-content?path=' + encodeURIComponent(fp) + '&disposition=inline');
        if(!r.ok) throw new Error('HTTP ' + r.status);
        const u8 = new Uint8Array(await r.arrayBuffer());
        acc += u8.length;
        files.push({ name: rp, data: u8 });
      }catch(e){ fail++; }
      done++; setBar(done, total); setTip('已读取 ' + done + '/' + (total-1) + ' 个文件（' + fmtSize(acc) + '）');
    }
  }
  try{
    for(const it of items){
      if(it.isDir) await collect(it.p, it.name);
      else{
        total++;
        try{
          const r = await call('GET', '/api/file-content?path=' + encodeURIComponent(it.p) + '&disposition=inline');
          if(!r.ok) throw new Error('HTTP ' + r.status);
          const u8 = new Uint8Array(await r.arrayBuffer());
          acc += u8.length;
          files.push({ name:it.name, data:u8 });
        }catch(e){ fail++; }
        done++; setBar(done, total);
      }
    }
    if(!files.length){ m.remove(); toast('没有可打包的文件'); return; }
    setTip('正在打包 ' + files.length + ' 个文件…');
    const zip = zipStore(files);
    const zipName = (items.length === 1 ? (items[0].name || 'archive') : ('打包 ' + items.length + ' 项')) + '.zip';
    saveBlobObject(new Blob([zip], {type:'application/zip'}), zipName);
    m.remove();
    toast('已打包下载：' + files.length + ' 个文件' + (fail ? '（' + fail + ' 个失败）' : ''));
  }catch(e){
    m.remove();
    modal('打包失败', '<div class="tip">' + esc(e.message) + '</div>', {ok:'知道了', cancel:null});
  }
}

/* ============================================================================
   列表渲染（竞态防护 + 路径比对）
   ========================================================================= */
function fullPath(it){
  if(it.raw && (it.raw.startsWith('/') || it.raw.length > it.name.length)) return it.raw;
  return (S.path === '/' ? '' : S.path) + '/' + it.name;
}
/* 按完整路径查条目：原实现按文件名查，同名不同目录会取错 */
function itemByPath(p){
  return S.items.find(x => fullPath(x) === p)
      || S.items.find(x => x.name === (p.split('/').filter(Boolean).pop() || ''));
}
const sizeOf = p => { const it = itemByPath(p); return it ? it.size : 0; };

async function load(p){
  const my = ++S.seq;                 // 竞争防护：编号
  S.path = normPath(p || '/');
  S.sel.clear();
  hideStatus(); showSpinner('正在读取…');
  try{
    const d = await apiJson('GET', target(S.path));
    if(my !== S.seq) return;          // 已有更新的请求，丢弃本次结果
    S.items = extract(d);
    render();
    if(!S.items.length) status('<h3>空目录</h3><div>这里没有可显示的内容</div>');
  }catch(e){
    if(my !== S.seq) return;
    $('listWrap').innerHTML = '';
    status('<h3>读取失败</h3><div>' + esc(e.message) + '</div>' +
      '<div class="card">路径：<code>' + esc(S.path) + '</code></div>');
  }
}
function render(){
  const items = S.items.slice().sort((a,b) => {
    if(a.isDir !== b.isDir) return a.isDir ? -1 : 1;
    return a.name.localeCompare(b.name, 'zh');
  });
  S.view = items;
  let h = '<table><thead><tr><th>名称</th><th style="width:92px">大小</th>' +
    '<th class="tm" style="width:132px">修改时间</th><th style="width:1%"></th></tr></thead><tbody>';
  if(S.path !== '/')
    h += '<tr data-up="1"><td class="nm"><span class="ic">↩</span><b>..</b></td><td colspan="3"></td></tr>';
  items.forEach((it,i) => {
    const full = fullPath(it), k = kindOf(it.name, it.isDir);
    h += '<tr data-i="'+i+'" data-p="'+esc(full)+'" data-dir="'+(it.isDir?1:0)+'" data-name="'+esc(it.name)+
      '" data-kind="'+k+'">' +
      '<td class="nm"><input type="checkbox" class="pick" data-pick="'+i+'"' +
      (S.sel.has(i) ? ' checked' : '') + '>' +
      '<span class="ic">'+iconOf(it)+'</span><b>'+esc(it.name)+'</b></td>' +
      '<td class="sz">' + (it.isDir ? '—' : fmtSize(it.size)) + '</td>' +
      '<td class="tm">' + fmtTime(it.time) + '</td><td class="op">' +
      (it.isDir ? '<button data-a="open">打开</button>'
                : '<button data-a="view">查看</button><button data-a="dl">下载</button>' +
                  (archKind(it.name) ? '<button data-a="arc">解压</button>' : '')) +
      '<button data-a="ren">重命名</button><button data-a="del">删除</button></td></tr>';
  });
  h += '</tbody></table>';
  const wrap = $('listWrap');
  wrap.innerHTML = h;
  hideStatus();
  bindRows(wrap);
  const up = wrap.querySelector('tr[data-up]');
  if(up) up.onclick = () => load(S.path.replace(/\/[^/]*$/,'') || '/');
  renderCrumb();
  refreshClipButtons();
  checkTypeSanity(items);
  loadIcons();
}
function bindRows(wrap){
  wrap.querySelectorAll('tr[data-i]').forEach(tr => {
    const cb = tr.querySelector('.pick');
    if(cb) cb.onclick = e => {
      e.stopPropagation();
      const i = +tr.dataset.i;
      if(cb.checked) S.sel.add(i); else S.sel.delete(i);
      tr.classList.toggle('sel', cb.checked);
    };
    tr.onclick = e => {
      if(e.target.closest('button') || e.target.closest('.pick')) return;
      const i = +tr.dataset.i, it = S.view[i];
      if(!it) return;
      it.isDir ? load(fullPath(it)) : openPreview(i);
    };
    tr.querySelectorAll('button').forEach(b => { b.onclick = e => {
      e.stopPropagation();
      const i = +tr.dataset.i, it = S.view[i];
      if(!it) return;
      const p = fullPath(it), a = b.dataset.a;
      if(a === 'open') load(p);
      else if(a === 'view') openPreview(i);
      else if(a === 'arc') openArchive(i);
      else if(a === 'dl') download([{p, name:it.name}]);
      else if(a === 'ren') rename(p, it.name);
      else if(a === 'del') remove([{p, name:it.name, isDir:it.isDir}]);
    };});
  });
}
function renderCrumb(){
  const parts = S.path.split('/').filter(Boolean);
  let h = '<span data-i="-1">根目录</span>';
  parts.forEach((p,i) => { h += '<i>/</i><span data-i="'+i+'">'+esc(p)+'</span>'; });
  $('crumb').innerHTML = h;
  $('crumb').querySelectorAll('span').forEach(sp => { sp.onclick = () => {
    const i = +sp.dataset.i; load(i < 0 ? '/' : '/' + parts.slice(0,i+1).join('/')); }; });
}
/* 服务端没给类型字段、靠猜时才提示，且只引导去诊断 */
function checkTypeSanity(items){
  const box = $('alerts');
  box.innerHTML = '';
  if(!items.length) return;
  if(sessionStorage.getItem('mtra_noTypeWarn') === '1') return;
  const unsure = items.filter(x => !x.confident);
  if(!unsure.length) return;
  const el = document.createElement('div');
  el.className = 'alert';
  const sp = document.createElement('span');
  sp.textContent = '⚠ 服务端未返回类型字段，' + unsure.length + '/' + items.length +
    ' 项靠名称推断，可能不准。';
  el.appendChild(sp);
  const b2 = document.createElement('button');
  b2.textContent = '查字段'; b2.onclick = () => runDiag();
  const b3 = document.createElement('button');
  b3.textContent = '不再提示';
  b3.onclick = () => { sessionStorage.setItem('mtra_noTypeWarn','1'); box.innerHTML = ''; };
  el.appendChild(b2); el.appendChild(b3);
  box.appendChild(el);
}

/* ---------------- 真实图标（MT 的 file-icon 接口，带 LRU 回收） ---------------- */
function cacheIcon(p, u){
  if(S.iconCache.size > ICON_CACHE_MAX){
    const oldest = S.iconCache.keys().next().value;
    try{ URL.revokeObjectURL(S.iconCache.get(oldest)); }catch(e){}
    S.iconCache.delete(oldest);
  }
  S.iconCache.set(p, u);
}
async function loadIcons(){
  const rows = [...$('listWrap').querySelectorAll('tr[data-i]')];
  const todo = rows.filter(tr => {
    const it = S.view[+tr.dataset.i];
    if(!it || it.isDir) return false;
    const k = tr.dataset.kind;
    return (k === 'apk' || k === 'img') && !S.iconCache.has(fullPath(it));
  });
  let cur = 0;
  const mySeq = S.seq;
  const worker = async () => {
    while(cur < todo.length){
      if(mySeq !== S.seq) return;                  // 目录已切换，停止无用请求
      const tr = todo[cur++];
      const it = S.view[+tr.dataset.i];
      if(!it) continue;
      const p = fullPath(it);
      try{
        const r = await call('GET', '/api/file-icon?path=' + encodeURIComponent(p), {timeout:8000});
        if(r.status === 204 || r.status === 404 || !r.ok) continue;
        const blob = await r.blob();
        const u = URL.createObjectURL(blob);
        cacheIcon(p, u);
        const ic = tr.querySelector('.ic');
        if(ic && ic.isConnected) ic.innerHTML = '<img alt="" src="' + u + '">';
      }catch(e){}
    }
  };
  await Promise.all([worker(), worker(), worker(), worker()]);
}

/* ============================================================================
   下载
   ========================================================================= */
function openUrl(url){
  const a = document.createElement('a');
  a.href = url; a.target = '_blank'; a.rel = 'noopener';
  document.body.appendChild(a); a.click(); a.remove();
}
function saveBlobObject(blob, name){
  const u = URL.createObjectURL(blob);
  const a = document.createElement('a'); a.href = u; a.download = name || 'download'; a.click();
  setTimeout(() => URL.revokeObjectURL(u), 60000);
}
async function getTicket(p, disposition){
  const t = await apiJson('POST', '/api/auth/content-ticket', {json:{path:p, disposition:disposition}});
  const tk = t && (t.ticket || t.token || t.value || t.ticketId);
  if(!tk) throw new Error('票据响应中没有 ticket 字段：' + JSON.stringify(t).slice(0,160));
  return tk;
}
/* 下载失败时判断「它其实是目录」：必须要求列表非空，否则会把普通文件误判成目录 */
async function maybeDir(p){
  try{
    const d = await apiJson('GET', target(p));
    const arr = pickList(d);
    return Array.isArray(arr) && arr.length > 0;
  }catch(e){ return false; }
}
/* 策略：票据 URL 优先（不带自定义头，跨域稳、不被当弹窗拦）→ blob 兜底 → 目录纠错 */
async function download(list){
  for(const {p, name} of list){
    const big = sizeOf(p) > BIG_FILE;
    toast((big ? '大文件已交给浏览器下载：' : '正在下载 ') + name + (big ? '' : '…'));
    let lastErr = '';
    try{
      const tk = await getTicket(p, 'attachment');
      const url = apiUrl('/api/file-content?path=' + encodeURIComponent(p) +
        '&disposition=attachment&ticket=' + encodeURIComponent(tk));
      if(big){ openUrl(url); continue; }
      const r = await fetch(url);
      if(!r.ok) throw new Error('HTTP ' + r.status);
      saveBlobObject(await r.blob(), name);
      toast('已下载 ' + name);
      continue;
    }catch(e1){
      lastErr = String(e1.message);
      try{
        if(!big){
          const r = await call('GET', '/api/file-content?path=' + encodeURIComponent(p) +
            '&disposition=attachment');
          if(!r.ok) throw new Error('HTTP ' + r.status);
          saveBlobObject(await r.blob(), name);
          toast('已下载 ' + name);
          continue;
        }
      }catch(e2){ lastErr = String(e2.message); }
      try{
        const tk2 = await getTicket(p, 'attachment');
        openUrl(apiUrl('/api/file-content?path=' + encodeURIComponent(p) +
          '&disposition=attachment&ticket=' + encodeURIComponent(tk2)));
        toast('已在新窗口开始下载');
        continue;
      }catch(e3){}
      if(/40[134]/.test(lastErr) && await maybeDir(p)){
        toast('它是目录，已为你打开'); load(p); continue;
      }
      toast('下载失败：' + lastErr);
      runDiag(p);
    }
  }
}

/* ============================================================================
   预览
   ========================================================================= */
/* img/iframe/video 无法带自定义请求头，所以优先换票据拼成免签名 URL */
async function previewSrc(p, disposition){
  disposition = disposition || 'inline';
  try{
    const tk = await getTicket(p, disposition);
    return { url: apiUrl('/api/file-content?path=' + encodeURIComponent(p) +
      '&disposition=' + disposition + '&ticket=' + encodeURIComponent(tk)), revoke:null };
  }catch(e){
    const r = await call('GET', '/api/file-content?path=' + encodeURIComponent(p) +
      '&disposition=' + disposition);
    if(!r.ok) throw new Error('HTTP ' + r.status);
    const blob = await r.blob(), u = URL.createObjectURL(blob);
    return { url:u, revoke:() => URL.revokeObjectURL(u) };
  }
}
async function fetchText(p){
  try{
    const tk = await getTicket(p, 'inline');
    const r = await fetch(apiUrl('/api/file-content?path=' + encodeURIComponent(p) +
      '&disposition=inline&ticket=' + encodeURIComponent(tk)));
    if(!r.ok) throw new Error('HTTP ' + r.status);
    return await r.text();
  }catch(e){
    const r = await call('GET', '/api/file-content?path=' + encodeURIComponent(p) + '&disposition=inline');
    if(!r.ok) throw new Error('HTTP ' + r.status);
    return await r.text();
  }
}

let PV = { idx:-1, el:null, revoke:null, scale:1, mode:'auto' };
function closePreview(){
  if(PV.revoke){ try{ PV.revoke(); }catch(e){} }
  document.removeEventListener('keydown', pvKey);
  if(PV.el) PV.el.remove();
  PV = { idx:-1, el:null, revoke:null, scale:1, mode:'auto' };
}
async function openPreview(i){
  const it = S.view[i]; if(!it) return;
  if(it.isDir){ load(fullPath(it)); return; }
  PV.idx = i;
  const name = it.name, p = fullPath(it), k = kindOf(name, false);
  const el = document.createElement('div');
  el.className = 'pvmask';
  el.innerHTML =
    '<div class="pvbar">' +
      '<button data-p="prev">‹ 上一个</button><button data-p="next">下一个 ›</button>' +
      '<span class="nm2">'+esc(name)+'</span>' +
      (k === 'html' ? '<button data-p="mode" id="pvmode">源码</button>' : '') +
      (k === 'img' ? '<button data-p="zin">＋</button><button data-p="zout">－</button>' : '') +
      '<button data-p="edit">编辑</button><button data-p="dl">下载</button>' +
      '<button data-p="close">关闭 ✕</button>' +
    '</div>' +
    '<div class="pvbody" id="pvbody"><div class="pvempty">'+SPIN+'</div></div>' +
    '<div class="pvnote" id="pvnote"><span class="sp2"></span></div>';
  document.body.appendChild(el);
  PV.el = el;
  el.querySelector('.pvbar').onclick = e => {
    const b = e.target.closest('button'); if(!b) return;
    const a = b.dataset.p;
    if(a === 'close') closePreview();
    else if(a === 'prev') step(-1);
    else if(a === 'next') step(1);
    else if(a === 'dl') download([{p, name}]);
    else if(a === 'edit'){ closePreview(); edit(p, name); }
    else if(a === 'zin'){ PV.scale = Math.min(5, PV.scale*1.25); applyScale(); }
    else if(a === 'zout'){ PV.scale = Math.max(.2, PV.scale/1.25); applyScale(); }
    else if(a === 'mode'){
      PV.mode = PV.mode === 'src' ? 'render' : 'src';
      b.textContent = PV.mode === 'src' ? '渲染' : '源码';
      if(PV.revoke){ try{ PV.revoke(); }catch(x){} }
      PV.revoke = null; renderPreview();
    }
  };
  document.addEventListener('keydown', pvKey);
  renderPreview();
}
function pvKey(e){
  if(!PV.el) return;
  if(e.key === 'Escape') closePreview();
  else if(e.key === 'ArrowLeft') step(-1);
  else if(e.key === 'ArrowRight') step(1);
}
function step(d){
  const files = S.view.map((x,i)=>({x,i})).filter(o => !o.x.isDir);
  if(!files.length) return;
  let pos = files.findIndex(o => o.i === PV.idx);
  if(pos < 0) pos = 0;
  const nxt = files[(pos + d + files.length) % files.length];
  if(PV.revoke){ try{ PV.revoke(); }catch(e){} }
  PV.revoke = null; PV.scale = 1; PV.mode = 'auto'; PV.idx = nxt.i;
  PV.el.querySelector('.nm2').textContent = nxt.x.name;
  renderPreview();
}
function applyScale(){
  const img = PV.el && PV.el.querySelector('#pvbody img');
  if(img) img.style.transform = 'scale(' + PV.scale + ')';
}
function note(html){ const n = PV.el && PV.el.querySelector('#pvnote .sp2'); if(n) n.innerHTML = html; }

async function renderPreview(){
  const it = S.view[PV.idx];
  if(!it || !PV.el) return;
  const name = it.name, p = fullPath(it), k = kindOf(name, false);
  const body = PV.el.querySelector('#pvbody');
  body.innerHTML = '<div class="pvempty">'+SPIN+'</div>';
  note('类型：' + k + (it.size ? ' · ' + fmtSize(it.size) : ''));
  const fail = msg => { body.innerHTML = '<div class="pvempty">' + esc(msg) + '</div>'; };

  try{
    if(k === 'img'){
      const s = await previewSrc(p, 'inline'); PV.revoke = s.revoke;
      body.innerHTML = '';
      const im = document.createElement('img');
      im.src = s.url; im.alt = name;
      im.onerror = () => fail('图片加载失败，可尝试下载后查看');
      body.appendChild(im);
      note('图片 · ' + (it.size ? fmtSize(it.size) : '') + ' · ＋－ 可缩放');
      return;
    }
    if(k === 'video' || k === 'audio'){
      const s = await previewSrc(p, 'inline'); PV.revoke = s.revoke;
      const tag = k === 'video' ? 'video' : 'audio';
      body.innerHTML = '<' + tag + ' src="' + esc(s.url) + '" controls autoplay ' +
        (k === 'video' ? 'style="max-width:100%;max-height:100%"' : '') + '></' + tag + '>';
      note((k === 'video' ? '视频' : '音频') + ' · 直接播放');
      return;
    }
    if(k === 'pdf'){
      const s = await previewSrc(p, 'inline'); PV.revoke = s.revoke;
      body.innerHTML = '<iframe src="' + esc(s.url) + '" title="' + esc(name) + '"></iframe>';
      note('PDF · 由浏览器内置阅读器渲染；若空白请下载后用其它应用打开');
      return;
    }
    if(k === 'html'){
      if(PV.mode === 'src') return await showText(p, name, body, 'html');
      /* MT 的 file-content 响应带 CSP（frame-ancestors），直接给 iframe 的 src
         会被浏览器拒绝：net::ERR_BLOCKED_BY_CSP。服务端改不了，所以改为
         先把字节取回来、再用 srcdoc 渲染 —— srcdoc 不是网络请求，不受该 CSP 约束。 */
      try{
        const html = await fetchText(p);
        const f = document.createElement('iframe');
        f.setAttribute('sandbox','allow-scripts allow-same-origin allow-modals allow-popups');
        f.setAttribute('title', name);
        body.innerHTML = ''; f.srcdoc = html; body.appendChild(f);
        note('HTML · 已渲染（页面内引用的相对资源可能无法加载）');
        return;
      }catch(e){
        await showText(p, name, body, 'html');
        note('HTML · 无法渲染（' + e.message + '），已改为显示源码');
        const btn = PV.el && PV.el.querySelector('#pvmode');
        if(btn){ btn.textContent = '渲染'; btn.disabled = true; }
        return;
      }
    }
    if(k === 'text' || k === 'office' || k === 'archive' || k === 'apk' || k === 'other'){
      if(k === 'text') return await showText(p, name, body, k);
      let msg = '';
      if(k === 'office') msg = 'Office 文档（' + extOf(name).toUpperCase() + '）浏览器无法直接渲染，请下载后用 WPS / Office 打开。';
      else if(k === 'apk') msg = 'APK 是安装包，无法预览内容，可下载安装。';
      else if(k === 'archive'){
        msg = archKind(name) ? '这是压缩包，关闭本窗口后在列表点「解压」即可查看内部文件。'
                             : '该压缩格式浏览器不支持解压，请下载后用 MT 管理器打开。';
      }
      else msg = '暂不支持直接预览该类型，可尝试以文本方式查看。';
      body.innerHTML = '<div class="pvempty">' + esc(msg) + '</div>';
      const n = PV.el.querySelector('#pvnote');
      const b = document.createElement('button');
      b.textContent = '下载'; b.onclick = () => download([{p, name}]);
      n.appendChild(b);
      if(k !== 'apk'){
        const b2 = document.createElement('button');
        b2.textContent = '以文本查看'; b2.onclick = () => showText(p, name, body, 'other');
        n.appendChild(b2);
      }
      return;
    }
    fail('未知类型');
  }catch(e){
    fail('预览失败：' + e.message);
    if(/404/.test(String(e.message)) && await maybeDir(p)){
      fail('它其实是目录，正在打开…');
      setTimeout(() => { closePreview(); load(p); }, 600);
    }
  }
}

async function showText(p, name, body, kind){
  const e = extOf(name);
  if(kind === 'office' || kind === 'archive' || kind === 'apk'){
    body.innerHTML = '<div class="pvempty">二进制文件，无法以文本显示</div>';
    return;
  }
  const sz = sizeOf(p);
  if(sz > MAX_TEXT){
    body.innerHTML = '<div class="pvempty">文件较大（' + fmtSize(sz) +
      '），为避免卡死不做文本预览，请下载后查看。</div>';
    note('文本 · 已跳过（超过 ' + fmtSize(MAX_TEXT) + '）');
    return;
  }
  body.innerHTML = '<div class="pvempty">'+SPIN+'</div>';
  try{
    const r = await call('GET', '/api/text-file?path=' + encodeURIComponent(p));
    if(!r.ok){ body.innerHTML = '<div class="pvempty">读取失败 HTTP ' + r.status + '</div>'; return; }
    const txt = await r.text();
    const shown = txt.length > HARD_TEXT ? txt.slice(0, HARD_TEXT) : txt;
    const pre = document.createElement('pre');
    pre.textContent = shown;
    if(txt.length <= HARD_TEXT) pre.innerHTML = highlight(shown, e);
    body.innerHTML = ''; body.appendChild(pre);
    let extra = '';
    if(e === 'sh' || e === 'bash')
      extra = ' · <b>MT 远程接口不提供远程执行能力</b>，可在手机 MT 中长按该文件运行';
    note('文本 · ' + txt.length + ' 字符' +
      (txt.length > HARD_TEXT ? '（仅显示前 ' + HARD_TEXT + '）' : '') + extra);
  }catch(err){ body.innerHTML = '<div class="pvempty">' + esc(err.message) + '</div>'; }
}

/* ---------------- 轻量语法着色 ---------------- */
const KW = {
  sh:['if','then','else','fi','for','while','do','done','case','esac','function','return','export','local','echo','cd','exit','set'],
  py:['def','class','import','from','return','if','elif','else','for','while','try','except','finally','with','as','lambda','None','True','False','and','or','not','in','is','pass','yield'],
  js:['function','const','let','var','if','else','for','while','return','class','new','this','import','export','from','async','await','try','catch','finally','typeof','null','undefined','true','false'],
  json:['true','false','null'],
  java:['public','private','protected','class','interface','extends','implements','static','final','void','int','String','new','return','if','else','for','while','try','catch','import','package'],
  smali:['const','move','invoke','return','if','goto','new','instance','iget','iput','sget','sput','class','super'],
  xml:['xml','version','encoding'], html:['html','head','body','div','script','style','title','meta','link'],
  sql:['select','from','where','insert','into','update','delete','create','table','and','or','join'],
};
const HASH_EXT  = ['sh','bash','py','yml','yaml','conf','ini','prop','properties','hosts','list','cfg','toml','gitignore'];
const SLASH_EXT = ['js','mjs','ts','tsx','jsx','java','kt','c','h','cpp','hpp','cs','go','rs','php','swift','css','json'];
function highlight(src, ext){
  const s = esc(src);
  const kw = KW[ext] || [];
  const parts = [];
  if(HASH_EXT.indexOf(ext) >= 0) parts.push('(#[^\\n]*)');
  if(SLASH_EXT.indexOf(ext) >= 0) parts.push('(//[^\\n]*)');
  parts.push('(/\\*[\\s\\S]*?\\*/)');
  parts.push('(&quot;[^&\\n]*?&quot;|&#39;[^\\n]*?&#39;)');
  parts.push('(\\b\\d+(?:\\.\\d+)?\\b)');
  if(kw.length) parts.push('(\\b(?:' + kw.join('|') + ')\\b)');
  const re = new RegExp(parts.join('|'), 'g');
  return s.replace(re, (m, hash, slash, block, str, num, kwm) => {
    if(hash != null || slash != null || block != null) return '<span class="cm">' + m + '</span>';
    if(str != null) return '<span class="str">' + m + '</span>';
    if(num != null) return '<span class="num">' + m + '</span>';
    if(kwm != null) return '<span class="kw">' + m + '</span>';
    return m;
  });
}

/* ============================================================================
   编辑（编码探测：BOM / UTF-8 严格校验 / GBK 兜底；换行自动还原）
   ========================================================================= */
function detectEncoding(buf){
  if(buf[0] === 0xEF && buf[1] === 0xBB && buf[2] === 0xBF) return { enc:'utf-8', bom:true };
  if(buf[0] === 0xFF && buf[1] === 0xFE) return { enc:'utf-16le', bom:true };
  if(buf[0] === 0xFE && buf[1] === 0xFF) return { enc:'utf-16be', bom:true };
  let i = 0, ok = true;
  while(i < buf.length){
    const b = buf[i];
    if(b < 0x80){ i++; continue; }
    let n = 0;
    if(b >= 0xC2 && b <= 0xDF) n = 1;
    else if(b >= 0xE0 && b <= 0xEF) n = 2;
    else if(b >= 0xF0 && b <= 0xF4) n = 3;
    else { ok = false; break; }
    if(i + n >= buf.length){ ok = false; break; }
    for(let k = 1; k <= n; k++) if((buf[i+k] & 0xC0) !== 0x80){ ok = false; break; }
    if(!ok) break;
    i += n + 1;
  }
  return { enc: ok ? 'utf-8' : 'gbk', bom:false };
}
function detectLineBreak(txt){
  const crlf = (txt.match(/\r\n/g) || []).length;   // 不用 lookbehind，兼容旧浏览器
  const lf = (txt.match(/\n/g) || []).length - crlf;
  return crlf > lf ? 'CRLF' : 'LF';
}
async function edit(p, name){
  const sz = sizeOf(p);
  if(sz > MAX_TEXT){
    modal('文件过大', '<div class="tip">「' + esc(name) + '」约 ' + fmtSize(sz) +
      '，超过 ' + fmtSize(MAX_TEXT) + '，在线编辑可能导致页面卡死，已取消。</div>' +
      '<div class="tip">如需修改，请下载后用电脑上的编辑器处理再上传。</div>',
      {ok:'知道了', cancel:null});
    return;
  }
  showSpinner('正在读取…');
  try{
    const tq = '/api/text-file?path=' + encodeURIComponent(p);
    const r = await call('GET', tq);
    if(!r.ok) throw new Error('HTTP ' + r.status);
    const tok = r.headers.get('X-MT-Text-Parameters-Token') || '';
    const buf = new Uint8Array(await r.arrayBuffer());
    const info = detectEncoding(buf);
    let txt;
    try{ txt = new TextDecoder(info.enc).decode(buf); }
    catch(e){ txt = new TextDecoder('utf-8').decode(buf); info.enc = 'utf-8'; }
    if(info.bom && info.enc === 'utf-8') txt = txt.replace(/^﻿/, '');
    const lb = detectLineBreak(txt);
    hideStatus();

    const m = modal('编辑 ' + name,
      '<div class="tip">编码：<b>' + info.enc.toUpperCase() + '</b>　换行：<b>' + lb +
      '</b>（保存时自动还原）</div>' +
      '<textarea id="editor">' + esc(txt) + '</textarea>',
      () => {
        const v = m.q('#editor').value;
        (async() => {
          const out = lb === 'CRLF' ? v.replace(/\r?\n/g, '\r\n') : v.replace(/\r\n/g, '\n');
          const blob = new Blob([out], {type:'text/plain;charset=' + info.enc});
          const h = await sha256B64(blob);
          const ch = 'TEXT_SAVE:v1:' + await sha256B64([p, lb, tok, '', blob.size, h].join('\n'));
          await apiJson('PUT', '/api/text-file?path=' + encodeURIComponent(p) + '&lineBreak=' + lb,
            {body:blob, headers:{'Content-Type':'text/plain;charset=' + info.enc,
              'X-MT-Text-Parameters-Token':tok}, contentHash:ch});
          m.remove(); toast('已保存'); load(S.path);
        })().catch(e => toast('保存失败：' + e.message));
        return false;
      });
    return m;
  }catch(e){ status('<h3>读取失败</h3><div>' + esc(e.message) + '</div>'); }
}

/* ============================================================================
   新建 / 重命名 / 删除 / 复制 / 剪切 / 粘贴
   删除与复制的请求体字段无文档，做成多格式自适应
   ========================================================================= */
function modal(title, html, opts){
  opts = opts || {};
  const onOk = (typeof opts === 'function') ? opts : opts.onOk;
  const okText = ('ok' in opts) ? opts.ok : '确定';
  const cancelText = ('cancel' in opts) ? opts.cancel : '取消';
  const m = document.createElement('div'); m.className = 'mask';
  let foot = '<div class="mfoot">';
  if(cancelText) foot += '<button class="btn g" data-x="cancel">' + esc(cancelText) + '</button>';
  if(okText) foot += '<button class="btn" data-x="ok">' + esc(okText) + '</button>';
  foot += '</div>';
  m.innerHTML = '<div class="modal"><h3>' + esc(title) + '</h3>' + html + foot + '</div>';
  document.body.appendChild(m);
  const close = () => m.remove();
  const cb = m.querySelector('[data-x="cancel"]'), ob = m.querySelector('[data-x="ok"]');
  if(cb) cb.onclick = () => { if(opts.onCancel) opts.onCancel(); close(); };
  if(ob) ob.onclick = () => {
    if(!onOk){ close(); return; }
    let r;
    try{ r = onOk(); }catch(e){ console.error(e); toast('操作出错：' + e.message); return; }
    if(r !== false) close();
  };
  m.onclick = e => { if(e.target === m){ if(opts.onCancel) opts.onCancel(); close(); } };
  m.q = sel => m.querySelector(sel);
  return m;
}
function mkdir(){
  const m = modal('新建文件夹', '<label>名称</label><input id="mv" placeholder="例如 backup">', () => {
    const v = (m.q('#mv') || {}).value.trim(); if(!v) return;
    apiJson('POST', '/api/file-create', {json:{targetPath:S.path, name:v, isDirectory:true}})
      .then(() => { toast('已创建'); load(S.path); })

  });
}
function rename(p, name){

    const v = ((m.q && m.q('#mv')) || {}).value;
    if(!v || !String(v).trim() || String(v).trim() === name) return;
    apiJson('POST', '/api/file-rename?path=' + encodeURIComponent(p) +
      '&newName=' + encodeURIComponent(String(v).trim()))
      .then(() => { toast('已重命名'); load(S.path); })

  });
  setTimeout(() => { const i = m.q('#mv'); if(i){ i.focus(); i.select(); } }, 80);

}
async function transfer(op, items, destPath){
  const base = S.path;
  const entries = items.map(x => ({ itemPath:x.p, name:x.name, isFile:!x.isDir }));
  const cands = [];
  if(op === 'delete'){
    cands.push(['POST', '/api/file-transfer', {basePath:base, items:entries, moveToRecycleBin:false}]);
    cands.push(['POST', '/api/file-transfer', {basePath:base, items:entries}]);
    cands.push(['POST', '/api/file-transfer', {operation:'delete', targetPath:base, entries, moveToRecycleBin:false}]);
    cands.push(['POST', '/api/file-transfer', {operation:'delete', basePath:base, paths:items.map(x => x.p)}]);
  }else{
    const action = op === 'copy' ? 'copy' : 'move';
    cands.push(['POST', '/api/file-transfer', {operation:action, targetPath:base, destPath, entries}]);
    cands.push(['POST', '/api/file-transfer', {operation:action, basePath:base, destPath, items:entries}]);
    cands.push(['POST', '/api/file-transfer', {operation:action, from:base, to:destPath, entries}]);
  }
  const errs = [];
  for(const [m,u,b] of cands){
    try{ await apiJson(m, u, {json:b}); return true; }
    catch(e){ errs.push(m + ' ' + String(e.message).slice(0,70)); }
  }
  throw new Error(errs.join(' ｜ '));
}
function selectedItems(){
  return [...S.sel].map(i => S.view[i]).filter(Boolean)
    .map(it => ({ p:fullPath(it), name:it.name, isDir:it.isDir }));
}
function remove(list){

    '<div class="tip">' + esc(list.map(x => x.name).join('、').slice(0,300)) + '</div>', () => {
    toast('正在删除…');
    transfer('delete', list).then(() => { toast('已删除'); S.sel.clear(); load(S.path); })
      .catch(e => {
        modal('删除失败', '<div class="tip">已尝试 4 种请求格式均被拒绝。</div>' +
          '<pre class="diag">' + esc(e.message) + '</pre>' +
          '<div class="tip">可点右上角 ⚕ 诊断，把结果发给页面作者协助适配。</div>',
          {ok:'知道了', cancel:null});
      });
  });
}
function doClip(mode){
  const items = selectedItems();
  if(!items.length){ toast('请先勾选文件'); return; }
  S.clip = { mode, base:S.path, items };
  S.sel.clear();
  toast((mode === 'copy' ? '已复制 ' : '已剪切 ') + items.length + ' 项，到目标目录点「粘贴」');
  render();
}
async function doPaste(){
  if(!S.clip) return;
  if(S.clip.base === S.path && S.clip.mode === 'move'){
    toast('源目录与目标目录相同，无需移动'); return;
  }
  toast('正在' + (S.clip.mode === 'copy' ? '复制' : '移动') + '…');
  try{
    await transfer(S.clip.mode, S.clip.items, S.path);
    toast('完成'); S.clip = null; refreshClipButtons(); load(S.path);
  }catch(e){
    modal('粘贴失败', '<div class="tip">目标：' + esc(S.path) + '（复制/移动的请求体字段无文档，' +

/* ============================================================================
   上传
   协议要点（按已知实现还原，保留兼容回退）：
     1) entries.path 是相对 targetPath 的路径
     2) 必须包含各级父目录条目（type:"directory", size:-1, time:0）
     3) time 用毫秒
     4) 上传顺序由服务端 nextUploadPath 驱动
   ========================================================================= */
function Kd(n){
  if(typeof n !== 'string') return '';
  let e = n.replace(/\\/g,'/');
  while(e.startsWith('./')) e = e.slice(2);
  while(e.startsWith('/')) e = e.slice(1);
  while(e.endsWith('/') && e.length > 1) e = e.slice(0,-1);
  return (!e || e === '.' || e.split('/').some(i => !i || i === '.' || i === '..')) ? '' : e;
}
function ancestorsOf(p, hasSlash){
  const parts = p.split('/'), out = [];
  for(let i = 0; i < parts.length - 1; i++)
    out.push({ path:parts.slice(0,i+1).join('/'), type:'directory', size:-1, time:0,
      topLevel:(i === 0 && !!hasSlash), file:null });
  return out;
}
function buildEntries(files){
  const raw = [];
  for(const f of files){
    const p = Kd(f.webkitRelativePath || f.name || '');
    if(!p) continue;
    const hasSlash = p.indexOf('/') >= 0;
    for(const a of ancestorsOf(p, hasSlash)) raw.push(a);
    raw.push({ path:p, type:'file', size:Math.max(Number(f.size)||0,0),
      time:Math.max(Number(f.lastModified)||0,0), topLevel:!hasSlash, file:f });
  }
  const map = new Map();
  for(const e of raw) if(!map.has(e.path)) map.set(e.path, e);
  return [...map.values()];
}
async function upload(list){
  const files = [...list].filter(f => f && f.size != null);
  if(!files.length) return;
  const base = S.path;
  const entries = buildEntries(files);
  if(!entries.length){ toast('没有可上传的文件'); return; }
  const fileMap = new Map();
  entries.forEach(e => { if(e.type === 'file' && e.file) fileMap.set(e.path, e.file); });
  const total = fileMap.size;

  const m = modal('上传中', '<div class="tip" id="upTip">准备…</div>' +
    '<div style="height:6px;background:var(--panel2);border-radius:999px;overflow:hidden;margin-top:8px">' +
    '<div id="upBar" style="height:100%;width:0;background:var(--brand);transition:width .2s"></div></div>',
    {ok:null, cancel:'后台继续'});
  const setTip = t => { const e = m.q('#upTip'); if(e) e.textContent = t; };
  const setBar = (d,t) => { const e = m.q('#upBar'); if(e) e.style.width = (t ? Math.round(d/t*100) : 0) + '%'; };

  try{
    const se = await apiJson('POST', '/api/file-upload-session', {json:{
      targetPath:base,
      entries:entries.map(e => ({path:e.path, type:e.type, size:e.size, time:e.time, topLevel:e.topLevel}))
    }});
    const taskId = se.taskId || se.id;
    if(!taskId) throw new Error('未返回 taskId');
    setTip('初始化任务…');
    await apiJson('POST', '/api/file-upload-prepare?taskId=' + encodeURIComponent(taskId));
    let sent = 0, done = false, guard = 0;
    const maxGuard = total * 6 + 30;                 // 防死循环
    while(!done && guard++ < maxGuard){
      const st = await apiJson('GET', '/api/file-upload-session?taskId=' + encodeURIComponent(taskId));
      if(st && st.done){ done = true; break; }
      const p = (st && st.nextUploadPath) || '';
      if(!p){
        const r = await apiJson('POST', '/api/file-upload-complete?taskId=' + encodeURIComponent(taskId));
        if(r && r.done){ done = true; break; }
        continue;
      }
      const b = await apiJson('POST', '/api/file-upload-begin?taskId=' +
        encodeURIComponent(taskId) + '&path=' + encodeURIComponent(p));
      if(!b || b.resumeAction === 'restart_begin' || b.armedPath !== p || !b.armToken) continue;
      const f = fileMap.get(p);
      if(!f) throw new Error('上传文件缺失：' + p);
      setTip('上传 ' + p + '（' + (sent+1) + '/' + total + '）');
      const ch = 'UPLOAD:v1:' + await sha256B64([taskId, p, b.armToken, f.size].join('\n'));
      await apiJson('POST', '/api/file-upload-content?taskId=' + encodeURIComponent(taskId) +
        '&path=' + encodeURIComponent(p) + '&armToken=' + encodeURIComponent(b.armToken),
        {body:f, headers:{'Content-Type':'application/octet-stream'}, contentHash:ch, timeout:0});
      sent++; setBar(sent, total);
    }
    if(!done) await apiJson('POST', '/api/file-upload-complete?taskId=' + encodeURIComponent(taskId));
    m.remove(); toast('上传完成：' + sent + ' 个文件'); load(S.path);
  }catch(e){
    try{
      setTip('主流程失败，改用兼容模式…');
      let n = 0;
      for(const [p,f] of fileMap){
        const b = await apiJson('POST', '/api/file-upload-begin?taskId=' +
          encodeURIComponent('fallback') + '&path=' + encodeURIComponent(p)).catch(() => null);
        const arm = (b && b.armToken) || '';
        const ch = 'UPLOAD:v1:' + await sha256B64(['fallback', p, arm, f.size].join('\n'));
        await apiJson('POST', '/api/file-upload-content?taskId=' + encodeURIComponent('fallback') +
          '&path=' + encodeURIComponent(p) + '&armToken=' + encodeURIComponent(arm),
          {body:f, headers:{'Content-Type':'application/octet-stream'}, contentHash:ch, timeout:0});
        n++; setBar(n, total);
      }
      m.remove(); toast('上传完成（兼容模式）：' + n + ' 个'); load(S.path);
    }catch(e2){
      m.remove();
      modal('上传失败', '<div class="tip">主流程：' + esc(String(e.message)) + '</div>' +
        '<div class="tip">兼容模式：' + esc(String(e2.message)) + '</div>' +
        '<div class="tip">可点右上角 ⚕ 诊断，把结果发给页面作者协助适配。</div>',
        {ok:'知道了', cancel:null});
    }
  }
}

async function probe(method, tq, opt){
  const t0 = Date.now();

    const r = await call(method, tq, opt);

    return { status:r.status, ms:Date.now()-t0, ct:r.headers.get('content-type')||'', body:txt.slice(0,220) };
  }catch(e){ return { status:'ERR', ms:Date.now()-t0, ct:'', body:String(e.message) }; }
