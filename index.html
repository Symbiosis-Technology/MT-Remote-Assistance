/* ============================================================================
   模拟终端

   两类命令分得很清：
     · 只读文件类（ls/cat/pwd/grep/find/du/stat/wc）→ 真发请求到手机
     · 写入与破坏类（rm/mv/dd/chattr/sysrq/kill/reboot/…）→ 交互模式下按规则
       决定真假，脚本模式（run xx.sh）下一律只在虚拟层仿真，绝不落到真机

   这样既是「能跑 sh」的终端，又天然是个恶意行为检测器：
   脚本执行完会弹行为报告，把所有高危动作列出来。
   ========================================================================= */
const TERM = { open:false, hist:[], hi:-1, busy:false, env:null, uid:null, abort:false };

/* ---------- 虚拟文件系统（只存在于内存） ---------- */
class VNode{ constructor(type){ this.type=type; this.content=""; this.children=new Map(); this.attr={immutable:false}; } }
function makeFs(){
  const root = new VNode("dir");
  const mkdir = path => { const parts=String(path).split("/").filter(p=>p); let cur=root;
    for(const p of parts){ if(!cur.children.has(p)) cur.children.set(p,new VNode("dir")); cur=cur.children.get(p); }
    return cur; };
  const mkfile = path => { const parts=String(path).split("/").filter(p=>p); const name=parts.pop();
    const dir=mkdir("/"+parts.join("/")); if(!dir.children.has(name)) dir.children.set(name,new VNode("file"));
    return dir.children.get(name); };
  const mkdev = (path,type) => { const n=mkfile(path); n.type=type||"block"; return n; };
  const getNode = path => { if(path==="/") return root; const parts=String(path).split("/").filter(p=>p);
    let cur=root; for(const p of parts){ if(!cur.children.has(p)) return null; cur=cur.children.get(p); } return cur; };
  const writeFile = (path,text) => { const nd=getNode(path); if(!nd) return false;
    if(nd.attr.immutable){ termLog("[VFS] EROFS "+path+" immutable","terr"); return false; }
    nd.content=String(text); return true; };
  const rm = path => { const parts=String(path).split("/").filter(p=>p); const name=parts.pop();
    const parent=getNode("/"+parts.join("/")); if(!parent||!parent.children.has(name)) return false;
    const n=parent.children.get(name);
    if(n.attr.immutable){ termLog("[VFS] rm 失败（immutable） "+path,"terr"); return false; }
    parent.children.delete(name); return true; };
  const chattrPlusI = path => { const n=getNode(path); if(n) n.attr.immutable=true; return !!n; };
  ["/system","/data","/cache","/proc","/sys","/dev/block","/dev","/mnt","/storage","/sbin",
   "/sys/class/gpio","/sys/class/backlight","/sys/class/power_supply","/sdcard"].forEach(mkdir);
  ["/system/build.prop","/default.prop","/proc/sys/kernel/sysrq","/proc/sysrq-trigger"].forEach(mkfile);
  mkdev("/dev/urandom","char"); mkdev("/dev/zero","char"); mkdev("/dev/watchdog","char");
  ["/dev/block/mmcblk0","/dev/block/sda","/dev/block/mmcblk0boot0",
   "/dev/block/by-name/boot","/dev/block/by-name/recovery"].forEach(p=>mkdev(p,"block"));
  return { getNode, writeFile, rm, chattrPlusI, mkdir, mkfile, mkdev, root };
}

/* ---------- 路径与切分 ---------- */
/* 硬拦截：真正的系统分区。删这些几乎必然变砖，不给确认的机会。
   /sdcard /mnt /storage 是用户数据，不在此列 —— 它们走「删前确认」而不是一刀切拒绝。 */
const CRITICAL = ['','/','/system','/vendor','/proc','/sys','/dev','/boot','/recovery','/odm',
  '/product','/apex','/data','/metadata','/cache','/etc','/bin','/sbin'];
function tPath(a){
  if(a == null || a === '') return S.path;
  let x = String(a).trim().replace(/^["']|["']$/g,'');
  if(x === '~' || x === '') x = '/sdcard';
  if(x === '-') return S.path;
  if(x.startsWith('/')) return normPath(x);
  return normPath((S.path === '/' ? '' : S.path) + '/' + x);
}
const WRITE_BLOCKED = ['/system','/vendor','/proc','/sys','/dev','/boot','/recovery',
  '/odm','/product','/apex','/etc','/bin','/sbin','/metadata'];
function normP(p){ return normPath(String(p||'').replace(/\/+$/,'')); }
function inList(p, list){
  const n = normP(p);
  return list.some(c => n === c || n.startsWith(c + '/'));
}
/* 删除风险：通配符、根目录、精确命中系统分区 */
function riskyDelete(p){
  const s = String(p||'');
  if(/[*?]/.test(s)) return '含通配符';
  const n = normP(s);
  if(n === '' || n === '/') return '根目录';
  if(CRITICAL.indexOf(n) >= 0) return '系统分区（' + n + '）';
  return null;
}
/* 写入风险：除上述外，还拦截写进系统分区内部（如 /system/build.prop） */
function riskyWrite(p){
  return riskyDelete(p) || (inList(p, WRITE_BLOCKED) ? '系统分区内部路径' : null);
}
function splitCmds(s){
  const out=[]; let cur=''; let q=null;
  for(let i=0;i<s.length;i++){
    const c=s[i];
    if(q){ cur+=c; if(c===q) q=null; continue; }
    if(c==='"'||c==="'"){ q=c; cur+=c; continue; }
    if(c===';'){ out.push(cur); cur=''; continue; }
    if(c==='&'&&s[i+1]==='&'){ out.push(cur); cur=''; i++; continue; }
    cur+=c;
  }
  out.push(cur);
  return out.map(x=>x.trim()).filter(Boolean);
}
function splitPipe(s){
  const out=[]; let cur=''; let q=null;
  for(let i=0;i<s.length;i++){
    const c=s[i];
    if(q){ cur+=c; if(c===q) q=null; continue; }
    if(c==='"'||c==="'"){ q=c; cur+=c; continue; }
    if(c==='|'){ out.push(cur); cur=''; continue; }
    cur+=c;
  }
  out.push(cur);
  return out.map(x=>x.trim()).filter(Boolean);
}
function unq(s){ return String(s==null?'':s).replace(/^["']|["']$/g,''); }

    return '可用命令：\n' +
      ' 只读（真连手机）: ls [-l] [路径]  cd [路径]  pwd  cat <文件>\n' +
      '                   head/tail -n N <文件>  grep [-i] <模式> <文件>\n' +
      '                   wc -l <文件>  stat <路径>  find [目录] [-name 模式]\n' +
      '                   du -sh [目录]\n' +
      ' 写入（交互模式真做，脚本模式仿真）: mkdir  touch  rm [-rf]  mv  cp\n' +
      '                   echo 内容 > 文件\n' +
      ' 文件操作:        pull <文件> 下载      edit <文件> 打开编辑器\n' +
      '                   unzip/tar <归档> [-l]   列出压缩包内容（真实解压）\n' +
      ' 脚本:            run <xx.sh>   读取手机上的脚本并仿真执行，结束后弹行为报告\n' +
      '                   exec <命令>   真实探测手机端有无执行接口并报告结果\n' +
      ' 仅仿真（永不落真机）: getprop  setprop  dd  chattr +i  umount  sync\n' +
      '                   sleep  kill -9  reboot  df  ps  mount\n' +
      '                   cansend(总线)  gpio  stty/AT(串口)\n' +
      ' 其它:            report 查看行为报告   reset 重置虚拟环境   clear 清屏\n' +
      ' 支持: 分号/&& 串联、管道 | grep|head|tail|wc、Tab 补全、↑↓ 历史';
  }
  if(c === 'clear'){ $('termOut').innerHTML = ''; return ''; }
  if(c === 'reset'){
    TERM.env = newSimEnv();
    if(TERM.uid != null) TERM.env.uid = TERM.uid;
    return '✅ 虚拟环境已重置';
  }
  if(c === 'report'){ buildReport('当前会话已记录的行为'); return ''; }

  /* ---- 只读：真连手机 ---- */
  if(c === 'pwd') return S.path;
  if(c === 'id' || c === 'whoami'){
    if(/id\s+-u/.test(raw)) return String(TERM.uid == null ? 0 : TERM.uid);
    return 'uid=' + (TERM.uid == null ? 0 : TERM.uid) + ' gid=' + (TERM.uid == null ? 0 : TERM.uid) +
      ' groups=root context=u:r:su:s0（模拟）';
  }
  if(c === 'ls'){
    const p = tPath(A[0]);
    const items = await tList(p);
    const long = flags.indexOf('l') >= 0;
    if(!items.length) return '（空目录）';
    const sorted = items.slice().sort((a,b) => a.isDir !== b.isDir ? (a.isDir ? -1 : 1)
      : a.name.localeCompare(b.name, 'zh'));
    return sorted.map(it => long
      ? (it.isDir ? 'drwxr-xr-x' : '-rw-r--r--') + '  ' + String(it.size).padStart(10) + '  ' +
        fmtTime(it.time) + '  ' + it.name + (it.isDir ? '/' : '')
      : fmtRow(it)).join('\n');
  }
  if(c === 'cd'){
    const p = tPath(A[0]);
    await tList(p);                 // 先验证存在
    S.path = p; S.sel.clear();
    renderCrumb(); refreshClipButtons();
    $('termPrompt').textContent = 'root@mt:' + (p === '/' ? '/' : p) + ' #';
    return '';
  }
  if(c === 'cat' || c === 'head' || c === 'tail' || c === 'wc' || c === 'grep'){
    if(!A.length) return c + ': 缺少文件名';
    // head/tail 的 -n 数字会留在参数里，文件名取最后一个；grep 的第二个参数是文件名
    let fileArg;
    if(c === 'grep') fileArg = A[1];
    else if(c === 'head' || c === 'tail') fileArg = A[A.length - 1];
    else fileArg = A[0];
    if(fileArg == null || fileArg === '' || /^-/.test(String(fileArg)))
      return c + ': 缺少文件名';
    const p = tPath(fileArg);
    let txt;
    try{ txt = await tReadText(p); }
    catch(e){ return c + ': 读取失败 ' + e.message + '（可能是二进制或非文本文件）'; }
    if(c === 'wc'){ return String(txt.split('\n').length); }
    if(c === 'grep'){
      const pat = A[0]; if(!pat) return 'grep: 缺少模式';
      let re;
      try{ re = new RegExp(pat, flags.indexOf('i') >= 0 ? 'gi' : 'g'); }
      catch(e){ return 'grep: 正则无效 ' + e.message; }
      return txt.split('\n').filter(l => { re.lastIndex = 0; return re.test(l); }).join('\n') || '（无匹配）';
    }
    if(c === 'head' || c === 'tail'){
      const nm = /-n\s*(\d+)/.exec(raw) || /-(\d+)/.exec(raw);
      const n = nm ? Number(nm[1]) : 10;
      const arr = txt.split('\n');
      return (c === 'head' ? arr.slice(0,n) : arr.slice(Math.max(0, arr.length-n))).join('\n');
    }
    if(txt.length > HARD_TEXT) return txt.slice(0, HARD_TEXT) + '\n…（已截断，共 ' + txt.length + ' 字符）';
    return txt;
  }
  if(c === 'stat'){
    const p = tPath(A[0]);
    const it = await tStat(p);
    if(!it) return 'stat: 找不到 ' + p;
    return '  文件: ' + p + '\n  类型: ' + (it.isDir ? '目录' : '文件') +
      '\n  大小: ' + fmtSize(it.size) + '\n  修改: ' + fmtTime(it.time);
  }
  if(c === 'find'){
    const start = tPath(A[0] && !A[0].startsWith('-') ? A[0] : '');
    const nm = /-name\s+(\S+)/.exec(raw);
    const pat = nm ? unq(nm[1]) : null;
    const dep = /-maxdepth\s+(\d+)/.exec(raw);
    const maxD = dep ? Number(dep[1]) : 3;
    const CAP = 400;
    let count = 0; const out = [];
    const re = pat ? new RegExp('^' + pat.replace(/[.+^${}()|[\]\\]/g,'\\$&')
      .replace(/\*/g,'.*').replace(/\?/g,'.') + '$', 'i') : null;
    async function walk(dir, d){
      if(TERM.abort || count > CAP || d > maxD) return;
      let items;
      try{ items = await tList(dir); }catch(e){ return; }
      for(const it of items){
        if(count > CAP) return;
        const fp = (dir === '/' ? '' : dir) + '/' + it.name;
        if(!re || re.test(it.name)){ out.push(fp); count++; }
        if(it.isDir) await walk(fp, d + 1);
      }
    }
    await walk(start, 1);
    if(count > CAP) termWarn('⚠ 结果超过 ' + CAP + ' 条已截断，目录很深会很慢');
    return out.join('\n') || '（无匹配）';
  }
  if(c === 'du'){
    const start = tPath(A[0] && !A[0].startsWith('-') ? A[0] : '');
    let total = 0, files = 0, capped = false;
    async function walk(dir, d){
      if(TERM.abort || d > 4 || capped) return;
      let items;
      try{ items = await tList(dir); }catch(e){ return; }
      for(const it of items){
        if(files > 1500){ capped = true; return; }
        if(!it.isDir){ total += it.size; files++; }
        else await walk((dir === '/' ? '' : dir) + '/' + it.name, d + 1);
      }
    }
    await walk(start, 1);
    if(capped) termWarn('⚠ 文件数超过 1500 已停止统计');
    return fmtSize(total) + '\t' + start + '（' + files + ' 个文件，最深 4 层）';
  }

  /* ---- 文件操作 ---- */
  if(c === 'pull'){
    const p = tPath(A[0]);
    await download([{ p, name: p.split('/').filter(Boolean).pop() || 'file' }]);
    return '';
  }
  if(c === 'edit'){
    const p = tPath(A[0]);
    closeTerm();
    edit(p, p.split('/').filter(Boolean).pop() || 'file');
    return '';
  }
  if(c === 'mkdir'){
    const p = tPath(A[0]);
    const name = p.split('/').filter(Boolean).pop() || '';
    const base = p.substring(0, p.length - name.length - 1) || '/';
    if(sim){ env.fs.mkdir(p); env.actions.push('mkdir 创建目录：' + p); return '[仿真] mkdir ' + p; }
    await apiJson('POST', '/api/file-create', {json:{targetPath:base, name, isDirectory:true}});
    return '已创建 ' + p;
  }
  if(c === 'touch'){
    const p = tPath(A[0]);
    const name = p.split('/').filter(Boolean).pop() || '';
    const base = p.substring(0, p.length - name.length - 1) || '/';
    if(sim){ env.fs.mkfile(p); env.actions.push('touch 创建文件：' + p); return '[仿真] touch ' + p; }
    await apiJson('POST', '/api/file-create', {json:{targetPath:base, name, isDirectory:false}});
    return '已创建 ' + p;
  }
  if(c === 'rm'){
    const targets = A.length ? A : [S.path];
    let msg = '';
    for(const t of targets){
      const p = tPath(t);
      const risk = riskyDelete(p);   // 仅系统分区/根目录/通配符硬拦截
      if(sim || risk){
        const ok = env.fs.rm(p);
        env.actions.push('rm 删除：' + p + (risk ? '（危险：' + risk + '）' : ''));
        termSim('[仿真] rm ' + p + (risk ? '  ⚠ ' + risk + '，已拦截，未真删' : ''));
        if(risk && !sim) termWarn('   ↳ 该路径命中危险规则，只做仿真，手机上的文件未受影响');
        continue;
      }
      const it = await tStat(p).catch(() => null);
      if(it && it.isDir && flags.indexOf('r') < 0){ termErr('rm: ' + p + ' 是目录，需要 -r'); continue; }
      // 目录递归删除不可逆，执行前必须确认
      if(it && it.isDir){
        const ok = await termConfirm('确定删除目录「' + p + '」及其全部内容？\n此操作不可恢复。');
        if(!ok){ termWarn('已取消：' + p); continue; }
      }
      await transfer('delete', [{ p, name:p.split('/').filter(Boolean).pop() || '', isDir:!!(it && it.isDir) }]);
      msg += '已删除 ' + p + '\n';
    }
    return msg.replace(/\n$/,'');
  }
  if(c === 'mv' || c === 'cp'){
    if(A.length < 2) return c + ': 用法 ' + c + ' <源> <目标>';
    const src = tPath(A[0]);
    const dst = A[1].startsWith('/') ? normPath(A[1]) : normPath((S.path === '/' ? '' : S.path) + '/' + A[1]);
    if(sim){
      env.actions.push((c === 'mv' ? 'mv 移动 ' : 'cp 复制 ') + src + ' → ' + dst);
      return '[仿真] ' + c + ' ' + src + ' → ' + dst;
    }
    // 目标若已存在且是目录，则移/复制到该目录内；否则按「父目录 + 新名字」处理
    const base = dst.split('/').filter(Boolean).pop() || '';
    let dstDir = dst.substring(0, dst.lastIndexOf('/')) || '/';
    const dstIt = await tStat(dst).catch(() => null);
    if(dstIt && dstIt.isDir) dstDir = dst;
    const srcIt = await tStat(src).catch(() => null);
    const item = { p:src, name:src.split('/').filter(Boolean).pop() || '', isDir:!!(srcIt && srcIt.isDir) };
    const srcDir = src.substring(0, src.lastIndexOf('/')) || '/';

    if(c === 'mv'){
      // 同目录 → 只改名；跨目录 → 必须走传输接口，否则只会改名不会移动
      if(normP(srcDir) === normP(dstDir)){
        await apiJson('POST', '/api/file-rename?path=' + encodeURIComponent(src) +
          '&newName=' + encodeURIComponent(base));
      }else{
        await transfer('move', [item], dstDir);
      }
      return '已移动 ' + src + ' → ' + dst;
    }
    await transfer('copy', [item], dstDir);
    return '已复制 ' + src + ' → ' + dst;
  }
  if(c === 'echo'){
    const redir = /^(.*?)\s*>>?\s*(\/[^\s;]+)\s*$/.exec(args.join(' '));
    if(redir && !sim){
      const p = normPath(redir[2]);
      const val = unq(redir[1]).replace(/\s*>\s*$/,'').trim();
      const risk = riskyWrite(p);
      if(risk){
        env.fs.writeFile(p, val);
        env.actions.push('echo 写入：' + p + '（危险：' + risk + '）');
        termWarn('⚠ ' + risk + '，已拦截，只做仿真');
        return '';
      }
      try{
        const g = await call('GET', '/api/text-file?path=' + encodeURIComponent(p));
        const tok = g.ok ? (g.headers.get('X-MT-Text-Parameters-Token') || '') : '';
        const blob = new Blob([val], {type:'text/plain;charset=UTF-8'});
        const h = await sha256B64(blob);
        const ch = 'TEXT_SAVE:v1:' + await sha256B64([p,'LF',tok,'',blob.size,h].join('\n'));
        const hdrs = {'Content-Type':'text/plain;charset=UTF-8'};
        if(tok) hdrs['X-MT-Text-Parameters-Token'] = tok;
        await apiJson('PUT', '/api/text-file?path=' + encodeURIComponent(p) + '&lineBreak=LF',
          {body:blob, headers:hdrs, contentHash:ch});
        return '已写入 ' + p;
      }catch(e){ return 'echo: 写入失败 ' + e.message; }
    }
    if(redir && sim){
      env.fs.writeFile(normPath(redir[2]), unq(redir[1]));
      env.actions.push('echo 写入：' + normPath(redir[2]));
      return '[仿真] 写入 ' + normPath(redir[2]);
    }
    return unq(args.join(' '));
  }

  /* ---- 脚本执行 ---- */
  if(c === 'run' || c === 'sh'){
    if(!A.length) return 'run: 用法 run <脚本路径>，例如 run /sdcard/test.sh';
    const p = tPath(A[0]);
    let src;
    try{ src = await tReadText(p); }
    catch(e){ return 'run: 读取失败 ' + e.message; }
    termSim('===== 开始仿真执行 ' + p + '（全部在虚拟环境，不落真机）=====');
    await simRunScript(src, p);
    return '';
  }

  /* ---- 真实执行：探测 MT 是否存在执行接口 ---- */
  if(c === 'exec' || c === 'probe-exec'){
    const cmd = args.join(' ');
    termWarn('正在探测手机端是否存在远程执行接口…（这是唯一可能真正运行命令的方式）');
    const cands = [
      ['POST','/api/exec',{command:cmd}],
      ['POST','/api/shell',{command:cmd}],
      ['POST','/api/terminal',{command:cmd}],
      ['POST','/api/run',{command:cmd}],
      ['POST','/api/command',{command:cmd}],
      ['POST','/api/file-exec',{path:cmd}],
      ['POST','/api/file-open',{path:cmd}],
      ['POST','/api/open-file',{path:cmd}],
      ['GET' ,'/api/exec?command=' + encodeURIComponent(cmd), null],
      ['GET' ,'/api/shell?command=' + encodeURIComponent(cmd), null],
    ];
    let found = null;
    const lines = [];
    for(const [m,u,b] of cands){
      let st = 'ERR', body = '';
      try{
        const r = await call(m, u, b ? {json:b} : {});
        st = r.status;
        body = (await r.text()).slice(0, 120);
      }catch(e){ body = String(e.message).slice(0, 60); }
      lines.push('  ' + m + ' ' + u.slice(0, 40) + '  → ' + st + (body ? '  ' + body : ''));
      if(st !== 404 && st !== 'ERR' && st !== 400 && st !== 401 && st !== 405){ found = {m,u,b,st,body}; }
    }
    lines.forEach(l => termLog(l, 'tout'));
    if(found){
      termOk('🟢 发现可用接口：' + found.m + ' ' + found.u + '（HTTP ' + found.st + '）');
      termOk('   响应：' + found.body);
      termWarn('   注意：返回 200 不代表命令真的执行了，请回手机确认效果');
      if(!sim) env_note('exec 探测命中 ' + found.u + ' 命令: ' + cmd);
    }else{
      termErr('🔴 全部 ' + cands.length + ' 个候选接口均返回 404/不存在');
      termLog('结论：你这台手机上 MT 的 HTTP 远程接口【没有提供命令执行能力】。', 'terr');
      termLog('这是服务端限制，不是本页缺陷 —— 网页端无论如何都变不出执行能力。', 'terr');
      termLog('真正能运行 sh 的三条路：', 'tout');
      termLog('  1. 手机 MT 管理器里长按该 .sh 文件 → 运行（最省事）', 'tout');
      termLog('  2. 电脑上 adb shell（需开 USB 调试）', 'tout');
      termLog('  3. 手机装 Termux，在里面起 SSH 或自己的服务', 'tout');
    }
    return '';
  }
  if(c === 'unzip' || c === 'tar'){
    if(!A.length) return c + ': 用法 ' + c + ' <归档路径> [-l]';
    const p = tPath(A[0]);
    const kind = archKind(p);
    if(!kind) return c + ': ' + p + ' 不是可解压的归档（支持 zip/apk/jar/tar/tar.gz）';
    const r = await call('GET', '/api/file-content?path=' + encodeURIComponent(p) + '&disposition=inline');
    if(!r.ok) return c + ': 读取失败 HTTP ' + r.status;
    const entries = await readArchive(new Uint8Array(await r.arrayBuffer()), kind, p);
    env.actions.push('查看归档 ' + p + '（' + entries.length + ' 项）');
    const lim = flags.indexOf('l') >= 0 ? entries.length : Math.min(entries.length, 50);
    return entries.slice(0, lim).map(e => String(e.usize).padStart(10) + '  ' + e.name).join('\n') +
      (entries.length > lim ? '\n…（共 ' + entries.length + ' 项，加 -l 全列）' : '') +
      '\n提示：在文件列表点「解压」按钮可查看内容并提取单个文件';
  }

  /* ---- 纯仿真：硬件与破坏类 ---- */
  if(c === 'getprop'){
    if(!A.length) return Object.keys(env.props).map(k => '[' + k + ']: [' + env.props[k] + ']').join('\n');
    return env.props[A[0]] == null ? '' : env.props[A[0]];
  }
  if(c === 'setprop'){
    if(A.length < 2) return 'setprop: 用法 setprop <键> <值>';
    env.props[A[0]] = args.slice(1).join(' ');
    env.actions.push('setprop 改属性：' + A[0] + ' = ' + env.props[A[0]]);
    termSim('[仿真] setprop ' + A[0] + ' = ' + env.props[A[0]]);
    return '';
  }
  if(c === 'dd'){
    const m = /if=(\S+).*of=(\S+)/.exec(raw);
    const src = m ? m[1] : '(未指定)';
    const dst = m ? m[2] : '(未指定)';
    const n = env.fs.getNode(dst);
    const isBlk = n && n.type === 'block';
    if(n) n.content = '<<OVERWRITTEN>>';
    env.actions.push('dd 用 ' + src + ' 覆写 ' + dst + (isBlk ? ' 【块设备/分区全盘覆写】' : ''));
    termSim('[仿真] dd ' + src + ' → ' + dst +
      (isBlk ? '  🔴 块设备覆写（真机将毁掉该分区）' : ''));
    if(isBlk) termWarn('   ↳ 已拦截，你的手机上什么都没发生');
    return '';
  }
  if(c === 'chattr'){
    const m = /\+([\w]+)\s+(\S+)/.exec(raw);
    if(m && m[1].indexOf('i') >= 0){
      const p = m[2];
      env.fs.chattrPlusI(p);
      env.actions.push('chattr +i 加锁：' + p);
      termSim('[仿真] chattr +i ' + p + '（真机上该文件将不可删改）');
      return '';
    }
    return '[仿真] chattr ' + (args.join(' ') || '');
  }
  if(c === 'umount'){
    const t = A[0] || '';
    if(/-[a-z]*f/.test(raw) || /-[a-z]*l/.test(raw)){
      env.mounts.delete(t);
      env.actions.push('umount 强制卸载：' + t);
      termSim('[仿真] umount -f -l ' + t + '  🔴 真机会导致分区损坏');
    }else{
      env.mounts.delete(t);
      env.actions.push('umount 卸载：' + t);
      termSim('[仿真] umount ' + t);
    }
    return '';
  }
  if(c === 'mount') return Array.from(env.mounts).map(m => m + ' on ' + m + ' type ext4 (ro)').join('\n');
  if(c === 'sync'){ env.actions.push('sync 刷缓冲区'); termSim('[仿真] sync'); return ''; }
  if(c === 'sleep'){
    const n = Number((/(\d+)/.exec(raw) || [0,0])[1]);
    env.sleepTotal += n;
    env.actions.push('sleep 等待 ' + n + ' 秒');
    termSim('[仿真] sleep ' + n + 's（不真等）');
    return '';
  }
  if(c === 'kill'){
    if(/-9/.test(raw)){
      env.actions.push('kill -9 强杀进程：' + (args.join(' ') || '(进程组)'));
      termSim('[仿真] kill -9 ' + args.join(' ') + '  🔴 真机会杀掉系统进程');
    }else termSim('[仿真] kill ' + args.join(' '));
    return '';
  }
  if(c === 'reboot'){
    env.actions.push('reboot 重启：' + (args.join(' ') || '正常重启'));
    termSim('[仿真] reboot ' + args.join(' ') + '  🔴 真机会真的重启');
    return '';
  }
  if(c === 'uname') return 'Linux localhost 4.19.x #1 SMP aarch64 Android（模拟）';
  if(c === 'df') return 'Filesystem      1K-blocks   Used Available Use% Mounted on\n' +
    '/dev/block/dm-0   5674820 4123996   1550824  73% /data\n' +
    '/dev/block/sda     983040  812224    170816  83% /system\n（模拟数据）';
  if(c === 'ps') return 'USER      PID   NAME\n' +
    'root        1   init\nroot      421   zygote64\nsystem    812   system_server\n（模拟数据）';
  if(c === 'cansend'){
    env.actions.push('CAN 总线发送帧：' + args.join(' '));
    termSim('[仿真] cansend ' + args.join(' ') + '（真机可能下发诊断指令）');
    return '';
  }
  if(c === 'gpio'){
    env.actions.push('GPIO 操作：' + raw);
    termSim('[仿真] ' + raw + '（真机可能控制硬件引脚）');
    return '';
  }
  if(c === 'stty'){
    env.actions.push('串口 AT 指令：' + raw);
    termSim('[仿真] ' + raw + '（真机可能下发调制解调指令）');
    return '';
  }
  /* sysrq 走 echo 分支前先拦 */
  const srq = /echo\s+(\w)\s*>\s*\/proc\/sysrq-trigger/.exec(raw);
  if(srq){
    const k = srq[1];
    const desc = k === 'o' ? '触发内核关机' : k === 'c' ? '触发内核崩溃' :
      k === 'f' ? '触发 OOM 杀进程' : k === 'b' ? '立即重启' : '内核指令 ' + k;
    env.actions.push('/proc/sysrq-trigger 发送 ' + k + '：' + desc);
    termSim('[仿真] sysrq ' + k + ' → ' + desc + '  🔴 真机会立即生效');
    return '';
  }
  /* 串口 AT 指令 */
  if(/echo\s+AT[A-Z]/.test(raw)){
    env.actions.push('串口 AT 指令：' + raw);
    termSim('[仿真] ' + raw + '（真机可能操作基带）');
    return '';
  }
  /* 自定义函数调用 */
  const fm = /^([a-zA-Z0-9_]+)\s*(.*)$/.exec(raw.trim());
  if(fm && env.funcs[fm[1]]){
    const fn = fm[1];
    env.actions.push('调用自定义函数 ' + fn + ' 参数: ' + (fm[2] || ''));
    termSim('==== 调用函数 ' + fn + ' ' + (fm[2] || '') + ' ====');
    for(const fl of env.funcs[fn].split('\n')){
      if(TERM.abort) break;
      await termExec(fl, { sim:true, quiet:false });
    }
    termSim('==== 函数 ' + fn + ' 返回 ====');
    return '';
  }
  return 'sh: ' + c + ': 未实现的命令（输入 help 看支持的命令）';
}

/* 终端内的确认对话框：破坏性操作前必须问一次 */
function termConfirm(msg){
  return new Promise(resolve => {
    modal('请确认', '<div class="tip">' + esc(msg) + '</div>',
      { ok:'确定执行', cancel:'取消',
        onOk: () => { resolve(true); },
        onCancel: () => { resolve(false); } });
  });
}

/* 管道过滤 */
function applyPipe(text, stages, sim){
  let cur = text;
  for(const st of stages){
    const m = /^(\S+)\s*([\s\S]*)$/.exec(st.trim());
    if(!m) continue;
    const c = m[1], arg = m[2].trim();
    const lines = String(cur).split('\n');
    if(c === 'grep'){
      if(!arg) continue;
      let re; try{ re = new RegExp(arg, 'gi'); }catch(e){ continue; }
      cur = lines.filter(l => { re.lastIndex = 0; return re.test(l); }).join('\n');
    }else if(c === 'head'){
      const n = Number((/(\d+)/.exec(arg) || [0,10])[1]);
      cur = lines.slice(0, n).join('\n');
    }else if(c === 'tail'){
      const n = Number((/(\d+)/.exec(arg) || [0,10])[1]);
      cur = lines.slice(Math.max(0, lines.length - n)).join('\n');
    }else if(c === 'wc'){
      cur = String(lines.length);
    }else{
      if(sim) termWarn('[仿真] 管道命令 ' + c + ' 未实现');
    }
  }
  return cur;
}

/* 执行一行（含分号/&& 串联与管道） */
async function termExec(line, opts){
  opts = opts || {};
  const sim = !!opts.sim;
  const raw0 = String(line == null ? '' : line);
  if(!raw0.trim() || raw0.trim().startsWith('#')) return;
  if(!opts.quiet){
    termLog('root@mt:' + (S.path === '/' ? '/' : S.path) + ' # ' + raw0.trim(), 'tcmd');
  }
  for(const one of splitCmds(raw0)){
    if(TERM.abort) break;
    const pipe = splitPipe(one);
    const m = /^(\S+)\s*([\s\S]*)$/.exec(pipe[0].trim());
    const c = m ? m[1] : '';
    const args = m && m[2].trim() ? m[2].trim().split(/\s+/) : [];
    try{
      let out = await termCmd(c, args, one, sim);
      if(pipe.length > 1) out = applyPipe(out == null ? '' : out, pipe.slice(1), sim);
      if(out != null && String(out) !== '') termLog(String(out), 'tout');
    }catch(e){
      termErr(c + ': ' + String(e.message).slice(0,160));
      if(sim) env_note(one);
    }
  }
}
function env_note(cmd){
  if(TERM.env) TERM.env.actions.push('执行失败的命令：' + cmd);
}

/* 解析并执行脚本：注册函数 → 逐行仿真 → 弹报告 */
async function simRunScript(src, label){
  const env = TERM.env;
  const lines = String(src).replace(/\r/g,'').split('\n');
  let fn = null, body = [];
  for(const raw of lines){
    if(TERM.abort) break;
    const t = raw.trim();
    if(t.startsWith('#')) continue;
    const fd = /^([a-zA-Z0-9_]+)\s*\(\)\s*\{\s*$/.exec(t);
    if(fd){ fn = fd[1]; body = []; continue; }
    if(fn !== null){
      if(t === '}'){ env.funcs[fn] = body.join('\n'); termLog('[注册函数] ' + fn + '()', 'tok'); fn = null; }
      else body.push(raw);
      continue;
    }
    await termExec(raw, { sim:true });
  }
  buildReport('脚本仿真行为报告：' + (label || ''));
}

/* 生成并弹出行为报告 */
function buildReport(title){
  const env = TERM.env;
  if(!env) return;
  const acts = env.actions;
  let rep = '⚠ ' + title + '\n';
  rep += '──────────────────────────────────────\n';
  rep += '设备仿真类型: ' + env.DEVICE_TYPE + '   UID: ' + env.uid + '\n';
  rep += '模拟累计 sleep: ' + env.sleepTotal + ' 秒\n';
  rep += '剩余挂载点: ' + (Array.from(env.mounts).join(', ') || '无') + '\n';
  rep += '记录行为总数: ' + acts.length + '\n';
  rep += '──────────────────────────────────────\n';
  if(!acts.length) rep += '未捕获到任何高危行为\n';
  else acts.forEach((a,i) => { rep += '[' + (i+1) + '] ' + a + '\n'; });
  rep += '──────────────────────────────────────\n';
  const bad = acts.filter(a => /覆写|chattr \+i|sysrq|umount 强制卸载|kill -9|危险|块设备|CAN 总线|GPIO|串口/.test(a));
  rep += '风险等级：';
  if(bad.length >= 3) rep += '🔴 极高危 —— 含多项破坏性操作，切勿在真机 root 下直接运行！';
  else if(bad.length) rep += '🟠 高危 —— 存在 ' + bad.length + ' 项破坏性操作，真机运行有风险';
  else rep += '🟡 普通 —— 未检测到严重破坏行为';
  $('repText').textContent = rep;
  $('repModal').style.display = 'flex';
}

/* ---------- 终端开关与交互 ---------- */
async function openTerm(){
  if(!S.identity){ toast('请先连接手机'); return; }
  if(!TERM.env){ TERM.env = newSimEnv(); }
  TERM.open = true;
  $('termWrap').style.display = 'flex';
  $('termPrompt').textContent = 'root@mt:' + (S.path === '/' ? '/' : S.path) + ' #';
  if(!$('termOut').childNodes.length){
    termLog('模拟终端已就绪。输入 help 查看命令，run <xx.sh> 仿真执行脚本。', 'tok');
    termLog('只读命令（ls/cat/grep…）真连手机；写入与硬件命令按规则仿真或拦截。', 'tsim');
  }
  // 探测是否具有 root 视野：能列出 /data 多半是 root
  if(TERM.uid == null){
    try{
      const items = await tList('/data');
      TERM.uid = items.length ? 0 : 2000;
    }catch(e){ TERM.uid = 2000; }
    TERM.env.uid = TERM.uid;
    $('termUid').textContent = TERM.uid === 0 ? 'uid=0 (root)' : 'uid=2000 (shell)';
    $('termUid').className = 'badge ' + (TERM.uid === 0 ? 'ok' : 'warn');
  }
  setTimeout(() => { const i = $('termIn'); if(i) i.focus(); }, 60);
}
function closeTerm(){
  TERM.open = false;
  $('termWrap').style.display = 'none';
}
async function termSubmit(){
  const i = $('termIn');
  const v = i.value;
  i.value = '';
  if(!v.trim()) return;
  TERM.hist.push(v);
  if(TERM.hist.length > 100) TERM.hist.shift();
  TERM.hi = TERM.hist.length;
  TERM.abort = false;
  TERM.busy = true;
  try{ await termExec(v); }
  catch(e){ termErr('执行出错：' + e.message); }
  TERM.busy = false;
  $('termPrompt').textContent = 'root@mt:' + (S.path === '/' ? '/' : S.path) + ' #';
}
/* Tab 补全：命令名 + 当前目录文件名 */
function termComplete(){
  const i = $('termIn');
  const v = i.value;
  const parts = v.split(/\s+/);
  const last = parts[parts.length - 1];
  const isFirst = parts.length === 1;
  const pool = isFirst ? CMDS : S.view.map(x => x.name);
  const hit = pool.filter(x => x.indexOf(last) === 0);
  if(hit.length === 1){
    parts[parts.length - 1] = hit[0];
    i.value = parts.join(' ') + (isFirst ? ' ' : '');
  }else if(hit.length > 1){
    termLog(hit.join('  '), 'tout');
  }
}

}

function saveHist(){
  let h = []; try{ h = JSON.parse(localStorage.getItem('mtra_hist') || '[]'); }catch(e){}

  h = [a].concat(h.filter(x => x !== a)).slice(0,5);
  localStorage.setItem('mtra_hist', JSON.stringify(h));
  renderHist();
}
function renderHist(){
  let h = []; try{ h = JSON.parse(localStorage.getItem('mtra_hist') || '[]'); }catch(e){}
  if(S.mode === 'same' || !h.length){ $('hint').innerHTML = ''; return; }
  $('hint').innerHTML = '最近：' + h.map(a =>
    '<span class="ch" data-a="' + esc(a) + '" style="cursor:pointer;color:var(--brand);margin-right:9px">' +
    esc(a) + '</span>').join('');
  $('hint').querySelectorAll('.ch').forEach(c => { c.onclick = () => {
    const m = c.dataset.a.match(/^([^:]+):?(\d*)/);

  if(a === 'close') closeTerm();
  else if(a === 'help') termExec('help');
  else if(a === 'report') buildReport('当前会话已记录的行为');
  else if(a === 'reset'){ termExec('reset'); }

$('termIn').addEventListener('keydown', e => {
  if(e.key === 'Enter'){ e.preventDefault(); termSubmit(); }
  else if(e.key === 'ArrowUp'){
    e.preventDefault();
    if(TERM.hi > 0){ TERM.hi--; $('termIn').value = TERM.hist[TERM.hi] || ''; }
  }
  else if(e.key === 'ArrowDown'){
    e.preventDefault();
    if(TERM.hi < TERM.hist.length - 1){ TERM.hi++; $('termIn').value = TERM.hist[TERM.hi] || ''; }
    else { TERM.hi = TERM.hist.length; $('termIn').value = ''; }
  }
  else if(e.key === 'Tab'){ e.preventDefault(); termComplete(); }
  else if(e.key === 'l' && e.ctrlKey){ e.preventDefault(); $('termOut').innerHTML = ''; }
  else if(e.key === 'c' && e.ctrlKey){ TERM.abort = true; termWarn('^C'); }
});
